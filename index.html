<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSM Chart Editor</title>
<style>
:root {
	--bg: #121214; --panel: #1c1c1f; --panel2: #232327; --line: #2e2e33; --line2: #3a3a40;
	--text: #d6d6da; --muted: #8b8b93; --dim: #5d5d65;
	--accent: #3aa7d0; --accent2: #2a7fa0; --danger: #e05a5a; --ok: #5ac47a; --warn: #e0b04a;
	--bt: #f2f2f2; --fx: #ff9a1f; --laserL: #2fb8ff; --laserR: #ff3d9a;
	--font: "Segoe UI", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
	--mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12.5px/1.35 var(--font); overflow: hidden; user-select: none; }
#app { display: flex; flex-direction: column; height: 100vh; }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: var(--panel2); border: 1px solid var(--line2); border-radius: 3px; padding: 3px 9px; cursor: pointer; }
button:hover { background: #2d2d33; border-color: #4a4a52; }
button:active { background: #36363d; }
button.on { background: var(--accent2); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
select, input[type=text], input[type=number], textarea { background: #151517; border: 1px solid var(--line2); border-radius: 3px; padding: 3px 5px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
input[type=number] { width: 72px; }
input[type=range] { accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); vertical-align: middle; }
textarea { width: 100%; resize: vertical; font-family: var(--mono); font-size: 11.5px; user-select: text; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.hidden { display: none !important; }
kbd { font: 10.5px var(--mono); background: #2a2a2f; border: 1px solid #3c3c44; border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: #c8c8cc; }

/* menu bar */
#menubar { display: flex; align-items: center; height: 28px; background: #18181b; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.brand { padding: 0 12px; font-weight: 600; color: #fff; letter-spacing: .2px; }
.brand::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 2px; background: linear-gradient(135deg, var(--laserL), var(--laserR)); }
#menus { display: flex; height: 100%; }
.menu { position: relative; height: 100%; }
.menu > .mlabel { height: 100%; display: flex; align-items: center; padding: 0 10px; cursor: default; }
.menu:hover > .mlabel, .menu.open > .mlabel { background: #2a2a30; }
.menu .mlist { display: none; position: absolute; top: 100%; left: 0; min-width: 250px; background: #222226; border: 1px solid var(--line2); box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 50; padding: 4px 0; }
.menu.open .mlist { display: block; }
.mitem { display: flex; justify-content: space-between; gap: 20px; padding: 4px 14px; cursor: default; white-space: nowrap; }
.mitem:hover { background: var(--accent2); color: #fff; }
.mitem .k { color: var(--muted); font-size: 11px; } .mitem:hover .k { color: #e8f6fb; }
.mitem.disabled { opacity: .4; pointer-events: none; }
.msep { height: 1px; background: var(--line2); margin: 4px 0; }
.mitem .chk { width: 14px; display: inline-block; }
.doc-title { margin-left: auto; padding-right: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45vw; }

/* option bar (tool options) */
#optbar { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; overflow-x: auto; white-space: nowrap; }
#optbar .grp { display: flex; align-items: center; gap: 5px; }
#optbar .sep { width: 1px; height: 20px; background: var(--line2); }
#optbar label { color: var(--muted); }
#optbar .hint { color: var(--dim); margin-left: auto; padding-left: 12px; }

/* main area */
#main { flex: 1; display: flex; min-height: 0; }
#previewPane { position: relative; width: 320px; flex-shrink: 0; display: flex; flex-direction: column; background: #000; border-right: 1px solid var(--line); }
#pvResize { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: ew-resize; z-index: 5; }
#pvResize:hover, #pvResize.on { background: rgba(120,160,255,0.25); }
.pv-speed { display: flex; align-items: center; gap: 3px; font-weight: 400; }
.pv-speed button { padding: 0 6px; min-width: 0; height: 18px; line-height: 16px; }
.pv-speed input { width: 46px; height: 18px; padding: 0 4px; text-align: center; }
.pv-speed .lbl { color: var(--muted); font-size: 11px; cursor: pointer; }
#previewPane canvas { flex: 1; width: 100%; min-height: 0; display: block; }
.pane-head { display: flex; justify-content: space-between; padding: 4px 8px; background: var(--panel); border-bottom: 1px solid var(--line); font-weight: 600; }
.pane-head .muted { font-weight: 400; font-size: 11px; }
#toolbox { width: 46px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 4px; }
.tool { width: 36px; height: 36px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.tool svg { width: 20px; height: 20px; }
.tool .kk { position: absolute; right: 2px; bottom: 0; font-size: 9px; color: var(--muted); }
.tool.on .kk { color: #e8f6fb; }
#toolbox .sep { width: 28px; height: 1px; background: var(--line2); margin: 3px 0; }
#timelineWrap { flex: 1; position: relative; min-width: 0; background: #0e0e11; }
#timeline { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#dropHint { position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 8px; display: none; align-items: center; justify-content: center; font-size: 16px; color: var(--accent); background: rgba(10,30,40,.6); pointer-events: none; }
#timelineWrap.drop #dropHint { display: flex; }

/* side panel */
#side { width: 310px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }
#tabs { display: flex; border-bottom: 1px solid var(--line); flex-shrink: 0; }
#tabs button { flex: 1; border: none; border-radius: 0; background: transparent; padding: 6px 2px; color: var(--muted); border-bottom: 2px solid transparent; }
#tabs button.on { color: #fff; border-bottom-color: var(--accent); background: #26262b; }
#tabs .badge { display: inline-block; min-width: 15px; padding: 0 4px; margin-left: 3px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; }
#tabBody { flex: 1; overflow-y: auto; padding: 8px 10px 16px; user-select: text; }
#tabBody::-webkit-scrollbar { width: 8px; } #tabBody::-webkit-scrollbar-thumb { background: #34343a; border-radius: 4px; }
.sec { margin-bottom: 12px; }
.sec h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 3px; font-weight: 600; }
.row { display: grid; grid-template-columns: 108px 1fr; align-items: center; gap: 6px; margin: 4px 0; }
.row > label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row > .ctl { display: flex; gap: 4px; align-items: center; min-width: 0; }
.row > .ctl > input[type=text], .row > .ctl > select { flex: 1; width: 100%; }
.row.wide { grid-template-columns: 1fr; }
.btns { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.note { color: var(--muted); font-size: 11.5px; margin: 4px 0 8px; }
.tag { display: inline-block; padding: 0 6px; border-radius: 3px; background: #2b2b31; font-size: 11px; }
.tag.bt { background: #4a4a4a; color: #fff; } .tag.fx { background: #6b3f08; color: #ffd39b; }
.tag.ll { background: #0b4767; color: #a7e2ff; } .tag.lr { background: #6a1640; color: #ffc0dc; }
.list { border: 1px solid var(--line); border-radius: 3px; max-height: 340px; overflow-y: auto; }
.li { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-bottom: 1px solid #26262a; cursor: pointer; }
.li:hover { background: #2a2a30; }
.li .t { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 64px; }
.li .msg { flex: 1; }
.li .x { border: none; background: none; color: var(--dim); padding: 0 4px; }
.li .x:hover { color: var(--danger); }
.lvl-error { color: #ff8080; } .lvl-warn { color: var(--warn); } .lvl-info { color: var(--muted); }

/* transport */
#transport { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; background: #18181b; border-top: 1px solid var(--line); flex-shrink: 0; white-space: nowrap; overflow-x: auto; }
#transport .sep { width: 1px; height: 22px; background: var(--line2); }
#transport .time { font: 15px var(--mono); color: #fff; min-width: 92px; }
#transport .pos { font: 12px var(--mono); color: var(--muted); min-width: 120px; }
#transport label { color: var(--muted); }
#transport button.play { width: 34px; }
#transport .spacer { flex: 1; }
.ibtn svg { width: 14px; height: 14px; vertical-align: -2px; }

/* popover / modal / toast */
.popover { position: fixed; z-index: 80; background: #232328; border: 1px solid var(--accent2); border-radius: 5px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.55); min-width: 200px; user-select: text; }
.popover h5 { margin: 0 0 6px; font-size: 12px; }
.popover .row { grid-template-columns: 80px 1fr; }
.modal { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
.modal-box { width: min(760px, 94vw); max-height: 86vh; display: flex; flex-direction: column; background: #1e1e22; border: 1px solid var(--line2); border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
.modal-head .x { border: none; background: none; font-size: 18px; padding: 0 6px; }
#modalBody { padding: 10px 14px 14px; overflow-y: auto; user-select: text; }
#modalBody table { border-collapse: collapse; width: 100%; }
#modalBody td { padding: 3px 6px; border-bottom: 1px solid #2a2a2e; vertical-align: top; }
#modalBody td:first-child { white-space: nowrap; color: var(--muted); width: 1%; }
#modalBody h3 { margin: 12px 0 6px; font-size: 13px; color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 95; background: #26262c; border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 7px 14px; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: 70vw; }
.toast.err { border-left-color: var(--danger); }
.banner { background: #1d3340; border: 1px solid var(--accent2); border-radius: 4px; padding: 8px; margin-bottom: 10px; }

@media (max-width: 1100px) { #previewPane { width: 220px; } #side { width: 270px; } }
@media (max-width: 820px) { #previewPane { display: none; } }

</style>
</head>
<body>
<div id="app">
	<header id="menubar">
		<div class="brand">KSM Chart Editor</div>
		<nav id="menus"></nav>
		<div id="docTitle" class="doc-title"></div>
	</header>
	<div id="optbar"></div>
	<main id="main">
		<aside id="previewPane">
			<div class="pane-head"><span>Preview</span><span id="pvSpeed" class="pv-speed"></span></div>
			<canvas id="preview"></canvas>
			<div id="pvResize" title="Drag to resize the preview"></div>
		</aside>
		<div id="toolbox"></div>
		<section id="timelineWrap">
			<canvas id="timeline" tabindex="0"></canvas>
			<div id="dropHint">Drop a .ksh chart and/or audio file</div>
		</section>
		<aside id="side">
			<div id="tabs"></div>
			<div id="tabBody"></div>
		</aside>
	</main>
	<footer id="transport"></footer>
</div>
<div id="popover" class="popover hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><span id="modalTitle"></span><button class="x" data-close>&times;</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="fileInput" multiple hidden accept=".ksh,.kson,.ogg,.mp3,.wav,.flac,.m4a,.opus,.aac,audio/*">
<script>
/* ============================================================================
 * KSM Chart Editor - core
 * Chart model, timing math and KSH (K-Shoot MANIA) import/export.
 * Pure logic, no DOM, so it can be unit-tested in Node and ported to C++.
 *
 * KSH semantics follow libkson (github.com/kshootmania/libkson) KshIOIn/KshIOOut:
 *   - 240 ticks per beat (960 per 4/4 measure), same as KSON "pulses"
 *   - laser positions are integers 0..50 (KSH characters 0-9A-Za-o)
 *   - a laser point with v != vf is a slam; in KSH it is written as a 1/32 segment
 * ========================================================================== */
(function (root) {
'use strict';

const RES = 240;               // ticks per beat
const MEAS4 = RES * 4;         // ticks per 4/4 measure
const LASER_MAX = 50;
const SLAM_LEN = MEAS4 / 32;   // 30 ticks - KSH laser segments this short are slams
const KSH_LEN = MEAS4 / 192;   // 5 ticks - KSH lengths (stop, spin) use 192 per measure

let _nextId = 1;
const nid = () => _nextId++;

const CAM_KEYS = ['zoom_top', 'zoom_bottom', 'zoom_side', 'center_split', 'rotation_deg', 'scroll_speed'];
const TILT_AUTO = ['normal', 'bigger', 'biggest', 'keep_normal', 'keep_bigger', 'keep_biggest', 'zero'];

// Header keys in the order libkson / KSM write them
const HEADER_KEYS = ['title', 'title_translit', 'title_img', 'artist', 'artist_translit', 'artist_img', 'effect',
	'jacket', 'illustrator', 'difficulty', 'level', 't', 'to', 'm', 'mvol', 'o', 'bg', 'layer', 'v', 'vo', 'po',
	'plength', 'pfiltergain', 'filtertype', 'chokkakuautovol', 'chokkakuvol', 'pfilterdelay', 'total', 'information',
	'icon', 'ver', 'ver_compat'];

// FX hold audio effects. "params" are the ;-separated values after the name.
const FX_EFFECTS = [
	{ name: 'Retrigger', params: [{ label: 'Wave 1/n', def: 8 }] },
	{ name: 'Gate', params: [{ label: 'Wave 1/n', def: 4 }] },
	{ name: 'Flanger', params: [] },
	{ name: 'PitchShift', params: [{ label: 'Pitch (12=1oct)', def: 12 }] },
	{ name: 'BitCrusher', params: [{ label: 'Reduction', def: 5 }] },
	{ name: 'Phaser', params: [] },
	{ name: 'Wobble', params: [{ label: 'Wave 1/n', def: 12 }] },
	{ name: 'TapeStop', params: [{ label: 'Speed', def: 50 }] },
	{ name: 'Echo', params: [{ label: 'Wave 1/n', def: 4 }, { label: 'Feedback %', def: 60 }] },
	{ name: 'SideChain', params: [] },
];
const LEGACY_FX_CHARS = {
	S: 'Retrigger;8', V: 'Retrigger;12', T: 'Retrigger;16', W: 'Retrigger;24', U: 'Retrigger;32',
	G: 'Gate;4', H: 'Gate;8', K: 'Gate;12', I: 'Gate;16', L: 'Gate;24', J: 'Gate;32',
	F: 'Flanger', P: 'PitchShift;12', B: 'BitCrusher;5', Q: 'Phaser', X: 'Wobble;12', A: 'TapeStop', D: 'SideChain',
};
const FX_WITH_PARAM = new Set(['Retrigger', 'Gate', 'Wobble', 'PitchShift', 'BitCrusher', 'TapeStop', 'Echo']);
const LASER_FILTERS = ['peak', 'lpf1', 'hpf1', 'bitc', 'fx', 'fx;bitc'];
const SLAM_SOUNDS = ['up', 'down', 'swing', 'mute'];
const FX_CHIP_SOUNDS = ['clap', 'clap_punchy', 'clap_impact', 'snare', 'snare_lo'];
const BG_PRESETS = ['desert', 'grass', 'night', 'deepsea', 'sky', 'sunset', 'ocean', 'flame', 'cyber', 'space', 'mars', 'cloudy', 'fantasy'];
const LAYER_PRESETS = ['arrow', 'smoke', 'wave', 'techno', 'snow', 'sakura', 'hidden'];
const DIFFICULTIES = ['light', 'challenge', 'extended', 'infinite'];

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------
function lowerBound(arr, t) { // first index with arr[i].t >= t
	let lo = 0, hi = arr.length;
	while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid].t < t) lo = mid + 1; else hi = mid; }
	return lo;
}
function upperBound(arr, t) { // first index with arr[i].t > t
	let lo = 0, hi = arr.length;
	while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid].t <= t) lo = mid + 1; else hi = mid; }
	return lo;
}
function lastAtOrBefore(arr, t) { const i = upperBound(arr, t) - 1; return i >= 0 ? arr[i] : null; }
function findAt(arr, t) { const i = lowerBound(arr, t); return (i < arr.length && arr[i].t === t) ? arr[i] : null; }
function insertSorted(arr, obj) { arr.splice(upperBound(arr, obj.t), 0, obj); return obj; }
function sortByT(arr) { return arr.sort((a, b) => a.t - b.t); }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function round3(v) { return Math.round(v * 1000) / 1000; }
function fmtNum(v) { // libkson FormatDouble: 3 decimals, trailing zeros removed
	v = round3(v);
	let s = v.toFixed(3);
	s = s.replace(/0+$/, '').replace(/\.$/, '');
	if (s === '-0') s = '0';
	return s;
}
function parseIntKsh(s, def = 0) { const v = parseInt(String(s).trim(), 10); return Number.isFinite(v) ? v : def; }
function parseFloatKsh(s, def = 0) { const v = parseFloat(String(s).trim()); return Number.isFinite(v) ? v : def; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function charToLaserX(c) {
	if (c >= '0' && c <= '9') return c.charCodeAt(0) - 48;
	if (c >= 'A' && c <= 'Z') return c.charCodeAt(0) - 65 + 10;
	if (c >= 'a' && c <= 'o') return c.charCodeAt(0) - 97 + 36;
	return 0;
}
function laserXToChar(x) {
	if (x >= 0 && x <= 9) return String.fromCharCode(48 + x);
	if (x >= 10 && x <= 35) return String.fromCharCode(65 + x - 10);
	if (x >= 36 && x <= 50) return String.fromCharCode(97 + x - 36);
	return '0';
}
// Laser value (0..50) to horizontal track position (0 = left knob lane centre, 1 = right knob lane centre)
function laserPos(v, wide) {
	if (!wide) return v / LASER_MAX;
	let g = v / LASER_MAX;
	if (v === 12) g = 0.25; else if (v === 37) g = 0.75; // libkson wide-laser zero fix
	return (g - 0.5) * 2 + 0.5;
}
function posToLaserX(pos, wide) { // inverse of laserPos, rounded to the KSH grid
	const g = wide ? (pos - 0.5) / 2 + 0.5 : pos;
	if (wide) {
		if (Math.abs(g - 0.25) < 0.005) return 12;
		if (Math.abs(g - 0.75) < 0.005) return 37;
	}
	return clamp(Math.round(g * LASER_MAX), 0, LASER_MAX);
}

// Quadratic bezier easing used by KSH/KSON curves (port of libkson EvaluateCurve)
function evalCurve(a, b, x) {
	if (Math.round(a * 1e8) === Math.round(b * 1e8)) return x; // linear
	a = clamp(a, 0, 1); b = clamp(b, 0, 1); x = clamp(x, 0, 1);
	const disc = a * a + x - 2 * a * x;
	const dSqrt = disc >= 0 ? Math.sqrt(disc) : 0;
	const t = a < 0.25 ? (a - dSqrt) / (-1 + 2 * a) : x / (a + dSqrt);
	return clamp(2 * (1 - t) * t * b + t * t, 0, 1);
}
const CURVE_PRESETS = [
	{ id: 'linear', label: 'Linear', a: 0, b: 0 },
	{ id: 'in', label: 'Ease in', a: 0.5, b: 0 },
	{ id: 'out', label: 'Ease out', a: 0.5, b: 1 },
	{ id: 'in2', label: 'Strong in', a: 1, b: 0 },
	{ id: 'out2', label: 'Strong out', a: 0, b: 1 },
];
function isLinear(p) { return !p.a && !p.b || Math.round(p.a * 1e8) === Math.round(p.b * 1e8); }

// ---------------------------------------------------------------------------
// Chart model
// ---------------------------------------------------------------------------
function newChart() {
	const meta = {};
	for (const k of HEADER_KEYS) meta[k] = '';
	Object.assign(meta, {
		difficulty: 'challenge', level: '1', o: '0', bg: 'desert', layer: 'arrow', po: '0', plength: '15000',
		pfiltergain: '50', filtertype: 'peak', chokkakuautovol: '0', chokkakuvol: '50',
	});
	return {
		meta,
		metaExtra: [],                 // unknown header [key, value]
		bt: [[], [], [], []],          // {id, t, l}  l = 0 chip, > 0 hold length
		fx: [[], []],                  // {id, t, l, fx?: effect string for holds, se?: "name;vol" for chips}
		laser: [[], []],               // {id, t, wide, pts: [{id, ry, v, vf, a, b}]}
		bpm: [{ id: nid(), t: 0, v: 120 }],
		sig: [{ id: nid(), m: 0, n: 4, d: 4 }],
		stops: [],                     // {id, t, l}
		cam: { zoom_top: [], zoom_bottom: [], zoom_side: [], center_split: [], rotation_deg: [], scroll_speed: [] },
		tilt: [],                      // {id, t, v: number|auto string, vf?: number|string, a, b}
		spins: [],                     // {id, t, kind: 'spin'|'half'|'swing', dir: -1|1, l (ticks), amp, rep, dec}
		slamSE: [],                    // {id, t, v}  chokkakuse
		slamVol: [],                   // {id, t, v}  chokkakuvol changes in body
		filterType: [],                // {id, t, v}
		pfilterGain: [],               // {id, t, v}
		raw: [],                       // {id, t, k, v}  options/lines kept verbatim (k '' = line, '//' = comment)
		defs: [],                      // '#define_fx ...' / '#define_filter ...' lines
	};
}

// Structural copy: new arrays/containers, same (immutable) item objects. Used for undo snapshots.

// Visual (scroll) position in beats, accounting for scroll_speed and stops. For the preview.
class ScrollMap {
	constructor(chart) {

	_integrate(t0, t1) {
		if (t1 <= t0) return 0;
		const n = Math.max(1, Math.min(32, Math.ceil((t1 - t0) / 15)));
		let acc = 0; const h = (t1 - t0) / n;

		while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (br[mid] <= t) lo = mid; else hi = mid - 1; }
		return this.cum[lo] + this._integrate(br[lo], t);
	}
}

// ---------------------------------------------------------------------------
// KSH import (port of libkson KshIOIn semantics)
// ---------------------------------------------------------------------------
function decodeKshBytes(bytes) {
	const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);

	catch (e) {
		try { return { text: new TextDecoder('shift_jis').decode(u8), encoding: 'shift_jis' }; }
		catch (e2) { return { text: new TextDecoder('utf-8').decode(u8), encoding: 'utf-8?' }; }
	}
}

function importKsh(input) {

	for (; li < lines.length; li++) {
		let line = lines[li];

		if (!isOptionLine(line)) continue;

		if (k === 'beat') {
			const [n, d] = v.split('/').map(x => parseIntKsh(x, 4));

		const p = prepFX[lane]; if (!p) return;

	};

		if (!prepFX[lane]) prepFX[lane] = { t, acc: 0, str: undefined, param: undefined, legacy: false };
		const p = prepFX[lane];

		const p = prepLaser[lane]; if (!p) return;

					case 'filtertype': c.filterType.push({ id: nid(), t, v }); break;
					case 'fx-l': fxStr[0].set(o.idx, v); break;
					case 'fx-r': fxStr[1].set(o.idx, v); break;
					case 'fx-l_param1': fxParam[0].set(o.idx, v); break;
					case 'fx-r_param1': fxParam[1].set(o.idx, v); break;
					case 'fx-l_se': fxSE[0].set(o.idx, v); break;
					case 'fx-r_se': fxSE[1].set(o.idx, v); break;

		curT += mlen; mIdx++;
	};

	for (; li < lines.length; li++) {
		let line = lines[li];
		if (line.endsWith('\r')) line = line.slice(0, -1);
		if (!line) continue;
		if (line.startsWith('//')) { commentLines.push({ idx: chartLines.length, v: line.slice(2) }); continue; }
		if (line[0] === '#') {
			if (line.startsWith('#define_fx ') || line.startsWith('#define_filter ')) c.defs.push(line);
			continue;
		}
		if (line.indexOf('|') !== -1) { chartLines.push(line); continue; }
		if (isOptionLine(line)) {
			const [k, v] = splitOption(line);
			if (k === 'beat') {
				const [n, d] = v.split('/').map(x => parseIntKsh(x, 4));
				curSig = { n: n || 4, d: d || 4 };
				const ex = c.sig.find(s => s.m === mIdx);
				if (ex) { ex.n = curSig.n; ex.d = curSig.d; } else c.sig.push({ id: nid(), m: mIdx, n: curSig.n, d: curSig.d });
			} else optLines.push({ idx: chartLines.length, k, v });
			continue;
		}
		if (line === '--') { processMeasure(); continue; }
		unknownLines.push({ idx: chartLines.length, v: line });
	}
	for (let i = 0; i < 4; i++) if (prepBT[i]) { warnings.push({ t: prepBT[i].t, msg: 'Chart does not end with "--"; an unfinished BT hold was dropped.' }); }
	for (let i = 0; i < 2; i++) if (prepFX[i]) { warnings.push({ t: prepFX[i].t, msg: 'Chart does not end with "--"; an unfinished FX hold was dropped.' }); }
	publishLaser(0); publishLaser(1);

	// ---- assemble ----
	const toArr = (map) => sortByT([...map.values()].map(o => ({ id: nid(), ...o })));
	c.bt = bt.map(toArr);
	c.fx = fx.map(toArr);
	c.laser = lasers.map(m => sortByT([...m.values()]));
	c.bpm = sortByT([...bpmMap.entries()].map(([t, v]) => ({ id: nid(), t, v })));
	if (!c.bpm.length) { c.bpm = [{ id: nid(), t: 0, v: 120 }]; warnings.push({ t: 0, msg: 'No BPM found; using 120.' }); }
	c.sig.sort((a, b) => a.m - b.m);
	c.stops = toArr(stops);
	for (const k of CAM_KEYS) c.cam[k] = toArr(cam[k]).map(p => ({ ...p, a: 0, b: 0 }));
	c.tilt = toArr(tilt).map(p => ({ ...p, a: 0, b: 0 }));
	c.spins = toArr(spins);
	c.slamSE = sortByT(slamSE);
	for (const k of ['slamVol', 'filterType', 'pfilterGain', 'raw']) c[k] = c[k].map((e, i) => [e, i]).sort((a, b) => a[0].t - b[0].t || a[1] - b[1]).map(e => e[0]);
	// curves
	for (const [pn, map] of Object.entries(curves)) {
		for (const [t, cv] of map) {
			if (pn === 'laser_l' || pn === 'laser_r') {
				for (const sec of c.laser[pn === 'laser_l' ? 0 : 1]) {
					const p = sec.pts.find(p => p.ry === t - sec.t);
					if (p) { p.a = cv.a; p.b = cv.b; }
				}
			} else {
				const arr = pn === 'tilt' ? c.tilt : c.cam[pn];
				if (!arr) { c.raw.push({ id: nid(), t, k: pn + '_curve', v: cv.a + ';' + cv.b }); continue; }
				const p = findAt(arr, t);
				if (p) { p.a = cv.a; p.b = cv.b; }
			}
		}
	}
	// Display BPM: keep only when it differs from what we'd compute
	if (c.meta.t === autoDispBpm(c)) c.meta.t = '';
	return { chart: c, warnings, encoding: dec.encoding };
}

function autoDispBpm(c) {
	if (!c.bpm.length) return '120';
	let mn = Infinity, mx = -Infinity;
	for (const b of c.bpm) { mn = Math.min(mn, b.v); mx = Math.max(mx, b.v); }
	return Math.round(mn * 1e8) === Math.round(mx * 1e8) ? fmtNum(mn) : fmtNum(mn) + '-' + fmtNum(mx);
}

// ---------------------------------------------------------------------------
// KSH export (port of libkson KshIOOut semantics)
// ---------------------------------------------------------------------------
function laserToKshSegments(sections) {
	const segs = [];
	for (const sec of sections) {
		const pts = sec.pts, wide = !!sec.wide;
		if (!pts.length) continue;
		if (pts.length === 1) {
			const p = pts[0];
			if (p.v !== p.vf) segs.push({ t: sec.t + p.ry, len: SLAM_LEN, sv: p.v, ev: p.vf, start: true, wide });
			else segs.push({ t: sec.t + p.ry, len: 0, sv: p.v, ev: p.v, start: true, wide });
			continue;
		}
		let first = true;
		for (let i = 0; i < pts.length; i++) {
			const p = pts[i], q = pts[i + 1], abs = sec.t + p.ry;
			if (p.v !== p.vf) {
				let sl = SLAM_LEN;
				if (q) {
					const dist = q.ry - p.ry;
					if (dist < SLAM_LEN) sl = (q.v === p.vf) ? Math.max(1, Math.floor(dist / 2)) : dist;
					else if (dist <= MEAS4 / 16 && q.v !== p.vf) sl = dist > SLAM_LEN + 20 ? 20 : dist > SLAM_LEN + 15 ? 15 : dist > SLAM_LEN + 10 ? 10 : 5;
				}
				segs.push({ t: abs, len: sl, sv: p.v, ev: p.vf, start: first, wide }); first = false;
				if (q) {
					const se = abs + sl, qa = sec.t + q.ry;
					if (se <= qa) segs.push({ t: se, len: qa - se, sv: p.vf, ev: q.v, start: false, wide });
				}
			} else if (q) {
				segs.push({ t: abs, len: (sec.t + q.ry) - abs, sv: p.v, ev: q.v, start: first, wide }); first = false;
			}
		}
	}
	return segs;
}

function exportKsh(chartIn, opts = {}) {
	const warnings = [];
	const c = opts.v1 ? toKsmV1(chartIn, warnings) : chartIn;
	const out = [];
	const timing = new Timing(c);
	const m = c.meta;

	// ---- header ----
	const H = (k, v) => out.push(k + '=' + v);
	H('title', m.title);
	if (m.title_translit) H('title_translit', m.title_translit);
	if (m.title_img) H('title_img', m.title_img);
	H('artist', m.artist);
	if (m.artist_translit) H('artist_translit', m.artist_translit);
	if (m.artist_img) H('artist_img', m.artist_img);
	H('effect', m.effect);
	H('jacket', m.jacket);
	H('illustrator', m.illustrator);
	H('difficulty', m.difficulty || 'light');
	H('level', m.level || '1');
	const headerBpm = m.t || autoDispBpm(c);
	H('t', headerBpm);
	if (m.to) H('to', m.to);
	if (m.m) H('m', m.m);
	if (m.mvol !== '') H('mvol', m.mvol);
	H('o', m.o || '0');
	if (m.bg) H('bg', m.bg);
	if (m.layer) H('layer', m.layer);
	if (m.v) { H('v', m.v); H('vo', m.vo || '0'); }
	H('po', m.po || '0');
	H('plength', m.plength || '0');
	if (m.pfiltergain) H('pfiltergain', m.pfiltergain);
	if (m.filtertype) H('filtertype', m.filtertype);
	H('chokkakuautovol', m.chokkakuautovol || '0');
	if (m.chokkakuvol) H('chokkakuvol', m.chokkakuvol);
	if (m.pfilterdelay) H('pfilterdelay', m.pfilterdelay);
	if (m.total) H('total', m.total);
	if (m.information) H('information', m.information);
	if (m.icon) H('icon', m.icon);
	let ver = m.ver || '171', verCompat = m.ver_compat;
	const vi = parseIntKsh(ver, 0);
	if (vi < 160) { if (!verCompat) verCompat = m.ver; ver = '160'; } // we write the >=1.60 FX syntax
	H('ver', ver);
	if (verCompat) H('ver_compat', verCompat);
	for (const [k, v] of c.metaExtra) H(k, v);
	out.push('--');

	// ---- lookups ----
	const segs = [laserToKshSegments(c.laser[0]), laserToKshSegments(c.laser[1])];
	const group = (arr) => { const mp = new Map(); for (const e of arr) { let g = mp.get(e.t); if (!g) mp.set(e.t, g = []); g.push(e); } return mp; };
	const bpmAt = group(c.bpm), stopAt = group(c.stops), tiltAt = group(c.tilt), spinAt = group(c.spins);
	const camAt = {}; for (const k of CAM_KEYS) camAt[k] = group(c.cam[k]);
	const seAt = group(c.slamSE), svolAt = group(c.slamVol), ftAt = group(c.filterType), pfgAt = group(c.pfilterGain), rawAt = group(c.raw);
	const fxStartAt = [group(c.fx[0]), group(c.fx[1])];
	const secAt = [group(c.laser[0]), group(c.laser[1])];
	const laserPtAt = [new Map(), new Map()];
	for (let i = 0; i < 2; i++) for (const s of c.laser[i]) for (const p of s.pts) if (!laserPtAt[i].has(s.t + p.ry)) laserPtAt[i].set(s.t + p.ry, p);

	// Event ticks for per-measure line division (dbl = needs doubled resolution, like libkson)
	const ev = [];
	let maxT = 0;
	const addEv = (t, dbl) => { ev.push({ t, dbl }); if (t > maxT) maxT = t; };
	for (const lanes of [c.bt, c.fx]) for (const lane of lanes) for (const n of lane) { addEv(n.t, n.l > 0); addEv(n.t + n.l, n.l > 0); }
	for (const s of segs) for (const g of s) { addEv(g.t, true); addEv(g.t + g.len, true); }
	for (const arr of [c.bpm, c.stops, c.tilt, c.spins, c.slamSE, c.slamVol, c.filterType, c.pfilterGain, c.raw]) for (const e of arr) addEv(e.t, false);
	for (const k of CAM_KEYS) for (const e of c.cam[k]) addEv(e.t, false);
	ev.sort((a, b) => a.t - b.t);

	const btChar = (lane, p) => {
		const n = findAt(lane, p);
		if (n) return n.l === 0 ? '1' : '2';
		const prev = lastAtOrBefore(lane, p);
		if (prev && p > prev.t && p < prev.t + prev.l) return '2';
		const i = lowerBound(lane, p) - 1; // a hold further back may still cover p if lanes overlap
		for (let k = i - 1; k >= 0 && k >= i - 3; k--) { const q = lane[k]; if (p > q.t && p < q.t + q.l) return '2'; }
		return '0';
	};
	const fxChar = (lane, p) => { const ch = btChar(lane, p); return ch === '1' ? '2' : ch === '2' ? '1' : '0'; };
	const laserChar = (sg, p) => {
		let i = upperBound(sg, p) - 1;
		for (let k = Math.max(0, i - 2); k <= i; k++) {
			const s = sg[k], end = s.t + s.len;
			if (p < s.t || p > end) continue;
			if (p === s.t) return laserXToChar(s.sv);
			if (p === end) return laserXToChar(s.ev);
			return ':';
		}
		return '-';
	};
	const writeGraph = (key, pt, intOnly) => {
		const f = intOnly ? (v) => String(Math.round(v)) : fmtNum;
		const s1 = f(pt.v); out.push(key + '=' + s1);
		if (pt.vf !== undefined && pt.vf !== pt.v) { const s2 = f(pt.vf); if (s2 !== s1) out.push(key + '=' + s2); }
		if (!isLinear(pt)) out.push(key + '_curve=' + fmtNum(pt.a) + ';' + fmtNum(pt.b));
	};
	const fmtTilt = (v) => typeof v === 'number' ? fmtNum(v) : v;

	const writeRow = (p) => {
		for (let i = 0; i < 2; i++) { const g = fxStartAt[i].get(p); if (g && g[0].l === 0 && g[0].se) out.push('fx-' + (i ? 'r' : 'l') + '_se=' + g[0].se); }
		const b = bpmAt.get(p);
		if (b) { const s = fmtNum(Math.min(b[0].v, 65535)); if (!(p === 0 && s === headerBpm)) out.push('t=' + s); }
		const raws = rawAt.get(p);
		if (raws) {
			for (const r of raws) if (r.k === '//') out.push('//' + r.v);
			for (const r of raws) if (r.k === '') out.push(r.v);
			for (const r of raws) if (r.k !== '//' && r.k !== '' && r.k !== 'fx-l' && r.k !== 'fx-r') out.push(r.k + '=' + r.v);
		}
		const cs = camAt.center_split.get(p); if (cs) writeGraph('center_split', cs[0], true);
		const pg = pfgAt.get(p); if (pg) for (const e of pg) out.push('pfiltergain=' + e.v);
		const ft = ftAt.get(p); if (ft) for (const e of ft) out.push('filtertype=' + e.v);
		const sv = svolAt.get(p); if (sv) for (const e of sv) out.push('chokkakuvol=' + e.v);
		const se = seAt.get(p); if (se) out.push('chokkakuse=' + se[0].v);
		const tl = tiltAt.get(p);
		if (tl) {
			const pt = tl[0];
			if (typeof pt.v === 'number') {
				if (!isLinear(pt)) out.push('tilt_curve=' + fmtNum(pt.a) + ';' + fmtNum(pt.b));
				out.push('tilt=' + fmtTilt(pt.v));
				if (pt.vf !== undefined && pt.vf !== pt.v) out.push('tilt=' + fmtTilt(pt.vf));
			} else if (p !== 0 || pt.v !== 'normal') out.push('tilt=' + pt.v);
		}
		for (const k of ['zoom_top', 'zoom_bottom', 'zoom_side']) { const g = camAt[k].get(p); if (g) writeGraph(k, g[0], true); }
		for (let i = 0; i < 2; i++) { const g = secAt[i].get(p); if (g && g[0].wide) out.push('laserrange_' + (i ? 'r' : 'l') + '=2x'); }
		for (let i = 0; i < 2; i++) { const pt = laserPtAt[i].get(p); if (pt && !isLinear(pt)) out.push('laser_' + (i ? 'r' : 'l') + '_curve=' + fmtNum(pt.a) + ';' + fmtNum(pt.b)); }
		const st = stopAt.get(p); if (st) out.push('stop=' + Math.round(st[0].l / KSH_LEN));
		const ss = camAt.scroll_speed.get(p); if (ss) writeGraph('scroll_speed', ss[0], false);
		const rd = camAt.rotation_deg.get(p); if (rd) writeGraph('rotation_deg', rd[0], false);
		for (let i = 0; i < 2; i++) {
			const key = 'fx-' + (i ? 'r' : 'l');
			const g = fxStartAt[i].get(p);
			if (g && g[0].l > 0 && g[0].fx !== undefined) out.push(key + '=' + g[0].fx);
			if (raws) for (const r of raws) if (r.k === key) out.push(key + '=' + r.v);
		}
		let line = btChar(c.bt[0], p) + btChar(c.bt[1], p) + btChar(c.bt[2], p) + btChar(c.bt[3], p) + '|' +
			fxChar(c.fx[0], p) + fxChar(c.fx[1], p) + '|' + laserChar(segs[0], p) + laserChar(segs[1], p);
		const sp = spinAt.get(p);
		if (sp) {
			const s = sp[0], len = Math.round(s.l / KSH_LEN);
			if (s.kind === 'spin') line += '@' + (s.dir < 0 ? '(' : ')') + len;
			else if (s.kind === 'half') line += '@' + (s.dir < 0 ? '<' : '>') + len;
			else {
				line += 'S' + (s.dir < 0 ? '<' : '>') + len;
				if (s.amp !== 250 || s.rep !== 3 || s.dec !== 2) line += ';' + s.amp + ';' + s.rep + ';' + s.dec;
			}
		}
		out.push(line);
	};

	let t = 0, mi = 0, curSig = { n: 4, d: 4 }, evi = 0;
	const sigByM = new Map(c.sig.map(s => [s.m, s]));
	for (;;) {
		const sig = timing.sigAt(mi);
		if (sigByM.has(mi) || sig.n !== curSig.n || sig.d !== curSig.d) { out.push('beat=' + sig.n + '/' + sig.d); curSig = sig; }
		const len = Math.floor(MEAS4 * sig.n / sig.d);
		// optimal division (libkson CalculateOptimalDivision)
		let g = len, dbl = false;
		while (evi < ev.length && ev[evi].t < t) evi++;
		for (let k = evi; k < ev.length && ev[k].t < t + len; k++) { const rel = ev[k].t - t; if (rel > 0) g = gcd(g, rel); if (ev[k].dbl) dbl = true; }
		let div = g > 0 ? len / g : len;
		if (div < len && dbl) {
			if (len % (div * 2) === 0) div *= 2;
			else if (len / div === 15 && len % (div * 3) === 0) div *= 3;
		}
		if (len % div !== 0) div = len;
		div = clamp(div, 1, len);
		const step = len / div;
		for (let i = 0; i < div; i++) writeRow(t + i * step);
		out.push('--');
		t += len; mi++;
		if (t > maxT) break;
	}
	for (const d of c.defs) out.push(d);
	return { text: '﻿' + out.join('\r\n') + '\r\n', warnings };
}

// KSM v1 compatibility: bake curves into linear steps, drop v2-only events
function toKsmV1(c, warnings) {
	const d = cloneChart(c);
	const bake = (pts, step, roundInt) => {
		const res = [];
		for (let i = 0; i < pts.length; i++) {
			const p = pts[i], q = pts[i + 1];
			res.push({ ...p, a: 0, b: 0 });
			if (!q || isLinear(p) || typeof q.v !== 'number' || typeof p.v !== 'number') continue;
			const pv = p.vf !== undefined ? p.vf : p.v;
			for (let t = p.t + step; t < q.t; t += step) {
				let v = pv + (q.v - pv) * evalCurve(p.a, p.b, (t - p.t) / (q.t - p.t));
				v = roundInt ? Math.round(v) : round3(v);
				res.push({ id: nid(), t, v, a: 0, b: 0 });
			}
		}
		return res;
	};
	let baked = 0;
	for (const k of ['zoom_top', 'zoom_bottom', 'zoom_side', 'center_split']) { if (d.cam[k].some(p => !isLinear(p))) baked++; d.cam[k] = bake(d.cam[k], 15, true); }
	if (d.tilt.some(p => !isLinear(p))) baked++;
	d.tilt = bake(d.tilt, 15, false);
	d.laser = d.laser.map(lane => lane.map(sec => {
		if (sec.pts.every(isLinear)) return sec;
		baked++;
		const pts = [];
		for (let i = 0; i < sec.pts.length; i++) {
			const p = sec.pts[i], q = sec.pts[i + 1];
			pts.push({ ...p, a: 0, b: 0 });
			if (!q || isLinear(p)) continue;
			const len = q.ry - p.ry, n = Math.floor(len / 40); // keep steps > 1/32 so they never read back as slams
			for (let k = 1; k < n; k++) {
				const ry = p.ry + Math.floor(k * len / n);
				const v = Math.round(p.vf + (q.v - p.vf) * evalCurve(p.a, p.b, (ry - p.ry) / len));
				pts.push({ id: nid(), ry, v, vf: v, a: 0, b: 0 });
			}
		}
		return { ...sec, pts };
	}));
	if (baked) warnings.push({ t: 0, msg: 'Curves were converted to straight steps for KSM v1.' });
	if (d.cam.scroll_speed.length) { warnings.push({ t: d.cam.scroll_speed[0].t, msg: 'scroll_speed is not supported by KSM v1 and was left out.' }); d.cam.scroll_speed = []; }
	if (d.cam.rotation_deg.length) { warnings.push({ t: d.cam.rotation_deg[0].t, msg: 'rotation_deg is not supported by KSM v1 and was left out.' }); d.cam.rotation_deg = []; }
	return d;
}

// ---------------------------------------------------------------------------
// Validation (things that would change or break when saved as KSH)
// ---------------------------------------------------------------------------
function validateChart(c) {
	const w = [];
	const lanesCheck = (lanes, name) => lanes.forEach((lane, li) => {
		for (let i = 0; i + 1 < lane.length; i++) {
			const a = lane[i], b = lane[i + 1];
			if (b.t < a.t + a.l) w.push({ t: b.t, level: 'error', msg: `${name} ${li + 1}: notes overlap.` });
			else if (a.l > 0 && b.l > 0 && b.t === a.t + a.l) w.push({ t: b.t, level: 'error', msg: `${name} ${li + 1}: two holds touch end-to-start and will merge into one in KSH.` });
		}
	});
	lanesCheck(c.bt, 'BT'); lanesCheck(c.fx, 'FX');
	c.laser.forEach((lane, li) => {
		const nm = li ? 'Laser R' : 'Laser L';
		for (let i = 0; i < lane.length; i++) {
			const s = lane[i], n = lane[i + 1];
			if (!s.pts.length) continue;
			if (s.pts.length === 1 && s.pts[0].v === s.pts[0].vf) w.push({ t: s.t, level: 'error', msg: `${nm}: a laser needs at least two points or a slam.` });
			for (let k = 0; k + 1 < s.pts.length; k++) {
				const p = s.pts[k], q = s.pts[k + 1];
				if (q.ry <= p.ry) w.push({ t: s.t + q.ry, level: 'error', msg: `${nm}: points out of order.` });
				else if (q.ry - p.ry <= SLAM_LEN && p.v === p.vf && q.v !== p.vf) w.push({ t: s.t + p.ry, level: 'warn', msg: `${nm}: a segment of 1/32 or shorter will be read as a slam.` });
			}
			if (n && n.t <= sectionEndTick(s)) w.push({ t: n.t, level: 'error', msg: `${nm}: lasers overlap or touch; leave a gap between them.` });
		}
	});
	if (!c.meta.m) w.push({ t: 0, level: 'info', msg: 'No music file set (m=).' });
	for (const k of ['scroll_speed', 'rotation_deg']) if (c.cam[k].length) w.push({ t: c.cam[k][0].t, level: 'info', msg: `${k} only works in KSM v2 (ignored by KSM v1).` });
	const curved = c.laser.some(l => l.some(s => s.pts.some(p => !isLinear(p)))) || CAM_KEYS.some(k => c.cam[k].some(p => !isLinear(p))) || c.tilt.some(p => !isLinear(p));
	if (curved) w.push({ t: 0, level: 'info', msg: 'Curves only work in KSM v2. Use "Export for KSM v1" to convert them to steps.' });
	return w.sort((a, b) => a.t - b.t);
}

const KSMCore = {
	RES, MEAS4, LASER_MAX, SLAM_LEN, KSH_LEN, CAM_KEYS, TILT_AUTO, HEADER_KEYS, FX_EFFECTS, LEGACY_FX_CHARS, LASER_FILTERS,
	SLAM_SOUNDS, FX_CHIP_SOUNDS, BG_PRESETS, LAYER_PRESETS, DIFFICULTIES, CURVE_PRESETS,

/* ============================================================================
 * Audio engine
 * The AudioContext clock is the single source of truth for playback time:
 *  - music is an AudioBufferSourceNode started at an exact context time
 *  - hitsounds are scheduled ahead on the same clock (sample accurate)
 *  - the visual playhead is derived from getOutputTimestamp(), i.e. what is
 *    coming out of the speakers right now, smoothed against performance.now()
 * ========================================================================== */
class AudioEngine {
	constructor() {
		this.ctx = null;
		this.buffer = null; this.fileName = '';
		this.src = null; this.playing = false;
		this.rate = 1;
		this.vol = { music: 0.8, hit: 0.55, metro: 0.0 };
		this.peaks = null;               // waveform mip levels [{bucket(s), data: Float32Array}]
		this.scheduled = [];
		this.t0Ctx = 0; this.t0Song = 0;
		this.offEMA = null; this.lastSong = -Infinity;
		this.userLatency = 0;            // seconds, visual compensation from settings
	}
	ensure() {
		if (!this.ctx) {
			const AC = window.AudioContext || window.webkitAudioContext;
			this.ctx = new AC({ latencyHint: 'interactive' });
			this.musicGain = this.ctx.createGain(); this.musicGain.connect(this.ctx.destination);
			this.hitGain = this.ctx.createGain(); this.hitGain.connect(this.ctx.destination);
			this.metroGain = this.ctx.createGain(); this.metroGain.connect(this.ctx.destination);
			this.applyVolumes();
			this.sounds = this._makeSounds();
		}
		if (this.ctx.state === 'suspended') this.ctx.resume();
		return this.ctx;
	}
	applyVolumes() {
		if (!this.ctx) return;
		this.musicGain.gain.value = this.vol.music;
		this.hitGain.gain.value = this.vol.hit;
		this.metroGain.gain.value = this.vol.metro;
	}
	get duration() { return this.buffer ? this.buffer.duration : 0; }

	async load(arrayBuffer, name) {
		const ctx = this.ensure();
		const buf = await ctx.decodeAudioData(arrayBuffer.slice(0));
		this.buffer = buf; this.fileName = name || '';
		this._buildPeaks();
		return buf;
	}

	_buildPeaks() {
		const b = this.buffer, n = b.length, ch = b.numberOfChannels;
		const B = 64; // base bucket in samples
		const m = Math.ceil(n / B), base = new Float32Array(m);
		const chans = []; for (let c = 0; c < ch; c++) chans.push(b.getChannelData(c));
		for (let i = 0; i < m; i++) {
			let mx = 0; const s0 = i * B, s1 = Math.min(n, s0 + B);
			for (let c = 0; c < ch; c++) { const d = chans[c]; for (let s = s0; s < s1; s += 2) { const v = d[s] < 0 ? -d[s] : d[s]; if (v > mx) mx = v; } }
			base[i] = mx;
		}
		const levels = [{ bucket: B, data: base }];
		let cur = base, bucket = B;
		while (cur.length > 64) {
			const nx = new Float32Array(Math.ceil(cur.length / 2));
			for (let i = 0; i < nx.length; i++) nx[i] = Math.max(cur[2 * i], cur[2 * i + 1] || 0);
			bucket *= 2; levels.push({ bucket, data: nx }); cur = nx;
		}
		this.peaks = { sr: b.sampleRate, levels };
	}
	// max amplitude in [t0, t1] seconds (song time)
	peakAt(t0, t1) {
		const P = this.peaks; if (!P) return 0;
		const span = Math.max(1, (t1 - t0) * P.sr);
		let L = 0; while (L + 1 < P.levels.length && P.levels[L + 1].bucket <= span) L++;
		const lv = P.levels[L], d = lv.data;
		let i0 = Math.floor(t0 * P.sr / lv.bucket), i1 = Math.floor(t1 * P.sr / lv.bucket);
		if (i1 < 0 || i0 >= d.length) return 0;
		i0 = Math.max(0, i0); i1 = Math.min(d.length - 1, i1);
		let mx = 0; for (let i = i0; i <= i1; i++) if (d[i] > mx) mx = d[i];
		return mx;
	}

	play(songTime, rate) {
		const ctx = this.ensure();
		this.stop();
		this.rate = rate || 1;
		const when = ctx.currentTime + 0.05;
		this.t0Ctx = when; this.t0Song = songTime;

			src.buffer = this.buffer;
			src.playbackRate.value = this.rate;
			src.connect(this.musicGain);
			if (songTime >= 0) src.start(when, songTime);
			else src.start(when + (-songTime) / this.rate, 0);
			this.src = src;
		}

	}
	stop() {
		if (this.src) { try { this.src.stop(); } catch (e) { } this.src.disconnect(); this.src = null; }

		this.scheduled = [];
		this.playing = false;
	}
	// Context time that is audible right now (output latency compensated), smoothed
	_audibleCtxTime() {
		const ctx = this.ctx, perf = performance.now() / 1000;
		let est;
		if (ctx.getOutputTimestamp) {
			const ts = ctx.getOutputTimestamp();
			if (ts && ts.contextTime > 0 && ts.performanceTime > 0) est = ts.contextTime + (perf - ts.performanceTime / 1000);
		}
		if (est === undefined) est = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
		// Smooth small timestamp jitter, but follow real jumps (audio glitches) immediately
		const off = perf - est;
		if (this.offEMA === null || Math.abs(off - this.offEMA) > 0.008) this.offEMA = off;
		else this.offEMA += (off - this.offEMA) * 0.1;
		return perf - this.offEMA;
	}
	songTimeNow() {
		if (!this.playing) return null;
		let s = this.t0Song + (this._audibleCtxTime() - this.t0Ctx) * this.rate - this.userLatency;
		if (s < this.lastSong && this.lastSong - s < 0.03) s = this.lastSong; // keep monotonic
		this.lastSong = s;
		return s;
	}
	// Context time at which a given song time will be heard
	ctxTimeFor(songTime) { return this.t0Ctx + (songTime - this.t0Song) / this.rate; }
	schedule(kind, songTime, gain) {
		const ctx = this.ctx; if (!ctx || !this.playing) return;
		const when = this.ctxTimeFor(songTime);
		if (when < ctx.currentTime - 0.002) return;
		const s = ctx.createBufferSource();
		s.buffer = this.sounds[kind];
		let node = s;
		if (gain !== undefined && gain !== 1) { const g = ctx.createGain(); g.gain.value = gain; s.connect(g); node = g; }
		node.connect(kind === 'metro' || kind === 'metroHi' ? this.metroGain : this.hitGain);
		s.start(Math.max(when, ctx.currentTime));
		s.onended = () => { const i = this.scheduled.indexOf(s); if (i >= 0) this.scheduled.splice(i, 1); };
		this.scheduled.push(s);
	}
	click() { // UI feedback sound when placing notes (not timing critical)
		if (!this.ctx || !this.sounds) return;
		const s = this.ctx.createBufferSource(); s.buffer = this.sounds.bt;
		const g = this.ctx.createGain(); g.gain.value = 0.35; s.connect(g); g.connect(this.hitGain); s.start();
	}

	_makeSounds() {
		const sr = this.ctx.sampleRate;
		const mk = (dur, fn) => {
			const n = Math.ceil(sr * dur), b = this.ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
			let seed = 1234567;
			const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x3fffffff - 1; };
			for (let i = 0; i < n; i++) d[i] = fn(i / sr, rnd);
			return b;
		};
		return {
			// bright click/clap for BT
			bt: mk(0.06, (t, r) => { const e = Math.exp(-t * 70); return (r() * 0.55 + Math.sin(2 * Math.PI * 2400 * t) * 0.45) * e * 0.9; }),
			// lower, fuller clap for FX
			fx: mk(0.09, (t, r) => { const e = Math.exp(-t * 45); return (r() * 0.6 + Math.sin(2 * Math.PI * 900 * t) * 0.5) * e * 0.9; }),
			// swoosh for laser slams
			slam: mk(0.16, (t, r) => { const e = Math.exp(-t * 22) * Math.min(1, t * 400); return r() * e * 0.8 + Math.sin(2 * Math.PI * (500 - t * 1800) * t) * e * 0.4; }),
			metro: mk(0.04, (t) => Math.sin(2 * Math.PI * 1500 * t) * Math.exp(-t * 90) * 0.8),
			metroHi: mk(0.05, (t) => Math.sin(2 * Math.PI * 2300 * t) * Math.exp(-t * 80) * 0.9),
		};
	}
}

<script>
const K = window.KSMCore;
const UI_FONT = '"Segoe UI", system-ui, -apple-system, sans-serif';

/* ============================================================================
 * Timeline view: geometry + rendering of the MMW-style vertical chart timeline.
 * Time flows upward. Only visible objects are drawn (binary search per lane).
 * ========================================================================== */
const COL_INFO = {
	zoom_top: { label: 'Zoom Top', short: 'ZT', range: 300, color: '#b48cff' },
	zoom_bottom: { label: 'Zoom Bottom', short: 'ZB', range: 300, color: '#8cb4ff' },
	zoom_side: { label: 'Zoom Side', short: 'ZS', range: 300, color: '#8cffc8' },
	tilt: { label: 'Tilt', short: 'TL', range: 1, color: '#ffd28c' },
	rotation_deg: { label: 'Rotation°', short: 'RO', range: 180, color: '#ff8cb4' },
	center_split: { label: 'Split', short: 'CS', range: 300, color: '#c8ff8c' },
	scroll_speed: { label: 'Scroll Spd', short: 'SS', range: 2, color: '#8cf0ff' },

const ALL_COLS = ['zoom_top', 'zoom_bottom', 'zoom_side', 'tilt', 'rotation_deg', 'center_split', 'scroll_speed'];

class TimelineView {
	constructor(canvas, ed) {
		this.cv = canvas; this.ctx = canvas.getContext('2d', { alpha: false });
		this.ed = ed;
		this.HEAD = 22;
		this.zoom = 1;          // px per tick = 0.25 * zoom
		this.bottomTick = -120; // tick at the bottom edge (below the header-free area)
		this.w = 0; this.h = 0; this.dpr = 1;
		this.cols = [];
		this.resize();
	}
	get ppt() { return 0.25 * this.zoom; }
	resize() {
		const r = this.cv.getBoundingClientRect();
		this.dpr = window.devicePixelRatio || 1;
		this.w = Math.max(100, Math.floor(r.width)); this.h = Math.max(100, Math.floor(r.height));
		this.cv.width = Math.floor(this.w * this.dpr); this.cv.height = Math.floor(this.h * this.dpr);
		this.layout();
	}
	layout() {
		const S = this.ed.settings;
		const G = 54, W = S.showWave ? 54 : 0;
		this.gutterR = G; this.waveL = G; this.waveR = G + W;
		this.laneW = S.laneW;
		this.trackL = this.waveR + 10;
		this.trackR = this.trackL + this.laneW * 6;
		this.timingL = this.trackR + 10; this.timingR = this.timingL + 84;
		const vis = ALL_COLS.filter(k => S.cols[k]);
		const avail = this.w - this.timingR - 6;
		const cw = vis.length ? Math.max(46, Math.min(84, Math.floor(avail / vis.length))) : 0;
		this.cols = vis.map((k, i) => ({ key: k, l: this.timingR + 6 + i * cw, r: this.timingR + 6 + (i + 1) * cw - 4 }));
		this.rangeCache = null;
	}
	// ---- geometry ----
	yOf(t) { return this.h - (t - this.bottomTick) * this.ppt; }
	tickAt(y) { return this.bottomTick + (this.h - y) / this.ppt; }
	btL(lane) { return this.trackL + this.laneW * (lane + 1); }
	fxL(lane) { return this.trackL + this.laneW * (1 + lane * 2); }
	laserX(v) { return this.trackL + this.laneW * 0.5 + (v / 50) * this.laneW * 5; }
	vAtX(x) { return (x - this.trackL - this.laneW * 0.5) / (this.laneW * 5) * 50; }
	region(x) {
		if (x < this.gutterR) return { kind: 'gutter' };
		if (x < this.waveR) return { kind: 'wave' };
		if (x < this.trackR + 6) return { kind: 'track' };
		if (x < this.timingR + 3) return { kind: 'timing' };

	}

		let mx = COL_INFO[key].range;
		for (const p of pts) { for (const v of [p.v, p.vf]) if (typeof v === 'number') mx = Math.max(mx, Math.abs(v) * 1.1); }

		c.strokeStyle = '#3c3c48'; c.beginPath();
		for (const x0 of [tl, tl + L * 3, tr]) { const x = Math.round(x0) + 0.5; c.moveTo(x, 0); c.lineTo(x, this.h); }

		for (const col of this.cols) { // zero line
			const x = Math.round(this.colX(col, 0)) + 0.5;

		this._drawLasers(t0, t1);

	_drawNotes(t0, t1) {

	laserPath(sec, lane, cb) { // calls cb(kind, ...) for every drawable piece of a section

<script>
/* ============================================================================
 * Preview: SDVX-style highway. The camera is a direct port of USC's portrait
 * camera (Main/src/Camera.cpp, Track.cpp, Game.cpp, Scoring.cpp; MIT licence),
 * so zoom_top / zoom_bottom / zoom_side / center_split, the engine's automatic
 * laser tilt (normal / bigger / biggest / zero / keep_*), manual tilt, slam

 * do in USC (which itself mimics SDVX).

	mul(a, b) {

	// Scoring::GetLaserRollOutput: current laser position, or an upcoming laser within 2 beats
	_laserOut(lane, tick) {
		const arr = this.ed.chart.laser[lane];
		const i = K.upperBound(arr, tick) - 1;
		const out = (raw) => lane === 0 ? -raw : 1 - raw;
		if (i >= 0) {
			const s = arr[i], lp = s.pts[s.pts.length - 1];

	_freshSim(sec) {
		const st = { sec, crit: 0, roll: 0, intensity: PV.MAX_ROLL, oldIntensity: PV.MAX_ROLL, manual: false, toggled: false, keep: false, keepTarget: 0,
			ignore: [0, 0], slamRoll: [0, 0], shake: 0, shakeAdd: 0, guard: 0, ei: 0 };
		const ch = this.ed.chart, tick = this.tickAtSec(sec);
		const tp = K.lastAtOrBefore(ch.tilt, tick);

		const v = p.vf !== undefined ? p.vf : p.v;

		if (typeof v === 'number') manual = true;
		else { keep = v.startsWith('keep_'); const b = keep ? v.slice(5) : v; lvl = { zero: 0, normal: 1, bigger: 2, biggest: 3 }[b] ?? 1; }

	// One frame of Game::Tick (camera part) + Camera::Tick
	_step(st, sec, dt) {
		const ev = this.ev;
		while (st.ei < ev.length && ev[st.ei].sec <= sec) {
			const e = ev[st.ei++];
			if (e.kind === 'tilt') this._applyTilt(st, e.p);
			else if (e.kind === 'slam') {

				if (e.end) { st.slamRoll[e.lane] = e.lane === 0 ? -e.tail : 1 - e.tail; st.ignore[e.lane] = PV.ROLL_IGNORE + PV.SLAM_DUR; }
			} else st.ignore[e.lane] = PV.ROLL_IGNORE;
		}
		const tick = this.tickAtSec(sec), MR = PV.MAX_ROLL;
		const live = [0, 1].map(l => st.ignore[l] <= 0 ? this._laserOut(l, tick) : null);
		const rL1 = live[0] ?? st.slamRoll[0], rR1 = live[1] ?? st.slamRoll[1];
		const slowTilt = (rL1 === -1 && rR1 === 1) || (rL1 === 0 && rR1 === 0);
		const target = (live[0] ?? 0) + (live[1] ?? 0);
		// SetTargetRoll
		const critTarget = K.clamp(target + st.slamRoll[0] + st.slamRoll[1], -1, 1) * MR;
		const keepT = K.clamp(target, -1, 1);
		if (!st.keep || st.keepTarget === 0 || (sgn(st.keepTarget) === sgn(keepT) && Math.abs(st.keepTarget) < Math.abs(keepT))) st.keepTarget = keepT;
		// Camera::Tick
		const lerpTo = (v, tg, speed) => { const c = dt * speed; return tg < v ? Math.max(v - c, tg) : Math.min(v + c, tg); };

		if (st.manual) {

		for (let i = 0; i < 2; i++) { st.ignore[i] -= dt; if (st.ignore[i] <= PV.ROLL_IGNORE) st.slamRoll[i] = 0; }

		const h = 1 / 240;
		while (st.sec + h < sec) this._step(st, st.sec + h, h);
		if (sec > st.sec) this._step(st, sec, sec - st.sec);

	}
	// camera parameters at a tick
	cameraAt(nowTick, continuous) {
		this._prep();

		const g = (k) => K.graphValueAt(ch.cam[k], nowTick, 0);
		const ver = parseInt(ch.meta.ver, 10) || 0;
		const st = this._simTo(sec, continuous);
		const cam = {
			zoom: g('zoom_bottom') / 100, pitchIn: g('zoom_top') / 100, offset: g('zoom_side') / 100, split: g('center_split') / 100,
			rot: g('rotation_deg'), pitchUnit: ver >= 168 ? 15 : 7, roll: st.roll, shake: st.shake, spinRoll: 0, bounce: 0,
		};

		const sp = this.spinsSec; let lo = 0, hi = sp.length;
		while (lo < hi) { const m = (lo + hi) >> 1; if (sp[m].sec <= sec) lo = m + 1; else hi = m; }
		const s = sp[lo - 1];
		if (s) {
			const isSwing = s.kind === 'swing';
			const dur = (isSwing ? 0.5 : 1) * (s.l / 5 / 192) * s.beat * 4;
			const prog = (sec - s.sec) / dur;
			if (prog < 2) {
				if (s.kind === 'spin') {
					const t = prog / 2, TS = 0.375, TR = 0.375;
					if (t <= TS) cam.spinRoll = -s.dir * (TS - t) / TS;
					else if (t < TS + TR) cam.spinRoll = uscSwing((t - TS) / TR) * 0.25 * s.dir;
				} else if (s.kind === 'half') cam.spinRoll = uscSwing(prog / 2) * s.dir;
				else cam.bounce = dampedSin(prog / 2, (s.amp || 0) / 250, (s.rep || 0) / 2, 3.0) * s.dir;

	}

		return Math.max(0.1, (S.modSpeed || 700) / (this.baseBpm || 120));

	// ------------------------------------------------------------ drawing
	draw(nowTick, continuous) {
		const ed = this.ed, ch = ed.chart, c = this.ctx, S = ed.settings;
		const cam = this.cameraAt(nowTick, continuous);
		const W = this.w, H = this.h, BW = PV.BTN_W, TL = PV.TRACK_LEN;
		// USC's camera is tuned for a 9:16 portrait screen: fit that box to the pane, and let the
		// picture continue past it when the pane is taller or wider (no letterboxing).
		// In a narrow pane the box may overhang the sides a little (the track itself spans ~81% of it).
		const vw = Math.min(H * 9 / 16, W / 0.86), vh = vw * 16 / 9;

		const totalOffset = (cam.offset * (5 * 100) / (6 * 116)) / 2 + cam.bounce;
		const worldNormal = uscOrigin(lanePitch, totalOffset, (cam.spinRoll + cam.roll) * 360 + cam.rot);
		const worldNoRoll = uscOrigin(lanePitch, 0, 0);
		const trackOrigin = uscZoomed(worldNormal, cam.zoom);
		const critOrigin = uscZoomed(uscOrigin(lanePitch, totalOffset, cam.roll * 360 + Math.sin(cam.spinRoll * Math.PI * 2) * 20 + cam.rot), cam.zoom);
		const cp = M4.pos(worldNoRoll), cl = Math.hypot(cp[0], cp[1], cp[2]);
		const rotToCrit = -Math.atan2(cp[1] / cl, -cp[2] / cl) * 180 / Math.PI;
		const camPitch = rotToCrit - (PV.FOV / 2 - PV.FOV * PV.PITCH_OFFSET);

		const S2 = (v) => [vx + (v[0] * fx / -v[2] * 0.5 + 0.5) * vw, vy + (0.5 - v[1] * fy / -v[2] * 0.5) * vh];

			for (let i = 0; i < vs.length; i++) {

				if (ia) out.push(a);
				if (ia !== ib) { const t = (-NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, -NEAR]); }
			}
			return out;
		};

		c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
		const far = P(mT, 0, TL * 1.2) || [vx + vw / 2, vy + vh * 0.3];
		const bg = c.createRadialGradient(far[0], far[1], 2, far[0], far[1], Math.max(W, H) * 0.8);
		bg.addColorStop(0, '#3b2260'); bg.addColorStop(0.25, '#1a1030'); bg.addColorStop(0.6, '#08060f'); bg.addColorStop(1, '#020205');
		c.fillStyle = bg; c.fillRect(0, 0, W, H);

		// ---- timing
		this._prep();
		const sm = this.sm;
		const drawSec = this.secAt(nowTick) - (S.drawOffsetMs || 0) / 1000;
		const drawTick = this.tickAtSec(drawSec);
		const bpm = ed.timing.bpmAt(Math.max(0, nowTick));
		const hs = this.hiSpeed();
		const viewRange = 8 / hs;
		const vNow = sm.at(drawTick);
		const yOf = (t) => (sm.at(t) - vNow) / viewRange * TL;
		const split = cam.split * 0.5 * BW;
		const sideX = (x) => x < -1e-6 ? x - split : x > 1e-6 ? x + split : x;

		// filled polygon given in track-plane coordinates [[x, y], ...]
		const poly = (m, pts, fill) => {
			const vs = clipNear(pts.map(p => V(m, p[0], p[1])));
			if (vs.length < 3) return;
			c.fillStyle = fill; c.beginPath();
			vs.forEach((v, i) => { const q = S2(v); if (i) c.lineTo(q[0], q[1]); else c.moveTo(q[0], q[1]); });
			c.closePath(); c.fill();
		};
		const quad = (m, x0, x1, y0, y1, fill) => {
			y0 = Math.max(y0, -1); y1 = Math.min(y1, TL);
			if (y1 <= y0) return;
			poly(m, [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], fill);
		};
		const line = (m, x0, y0, x1, y1, col, w) => {
			let a = V(m, x0, y0), b = V(m, x1, y1);
			const ia = a[2] <= -NEAR, ib = b[2] <= -NEAR;
			if (!ia && !ib) return;
			if (ia !== ib) { const t = (-NEAR - a[2]) / (b[2] - a[2]), q = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, -NEAR]; if (ia) b = q; else a = q; }
			const p = S2(a), q = S2(b);
			c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke();
		};

			const dx = side * split;
			const x0 = side < 0 ? -0.5 : 0, x1 = side < 0 ? 0 : 0.5;
			quad(mT, x0 + dx, x1 + dx, -1, TL, 'rgba(3,3,8,0.84)');
			quad(mT, (side < 0 ? -0.5 : 0.5 - BW) + dx, (side < 0 ? -0.5 + BW : 0.5) + dx, -1, TL, side < 0 ? 'rgba(20,110,200,0.22)' : 'rgba(200,20,120,0.22)');
		}
		for (let i = 1; i <= 5; i++) { const x = sideX(-0.5 + i * BW); line(mT, x, -1, x, TL, i === 1 || i === 5 ? 'rgba(225,235,255,0.62)' : 'rgba(200,210,235,0.42)', i === 3 ? 1.3 : 1.1); }
		for (const [x, col, glow] of [[-0.5 - split, '#7fdcff', 'rgba(40,180,255,0.30)'], [0.5 + split, '#ff8fcf', 'rgba(255,40,160,0.30)']]) {

		const chipLen = (y) => 0.125 * (1 + K.clamp(y / TL, 0, 1)); // USC: 48/64 texture ratio x 1/6, distantButtonScale = 2
		const fxX = (lane) => -2 * BW + lane * 2 * BW + (lane ? split : -split);
		const btX = (lane) => -2 * BW + lane * BW + (lane < 2 ? -split : split);

		// ---- holds (FX under BT)
		for (let lane = 0; lane < 2; lane++) {
			const a = ch.fx[lane], [i0, i1] = range(a), x0 = fxX(lane);
			for (let i = i0; i < i1; i++) {
				const n = a[i]; if (n.l <= 0) continue;
				const on = playing && nowTick >= n.t && nowTick <= n.t + n.l;
				quad(mT, x0 + 0.01, x0 + 2 * BW - 0.01, Math.max(0, yOf(n.t)), yOf(n.t + n.l), on ? 'rgba(255,205,110,0.92)' : 'rgba(255,150,30,0.78)');
			}
		}
		for (let lane = 0; lane < 4; lane++) {
			const a = ch.bt[lane], [i0, i1] = range(a), x0 = btX(lane);
			for (let i = i0; i < i1; i++) {
				const n = a[i]; if (n.l <= 0) continue;
				const on = playing && nowTick >= n.t && nowTick <= n.t + n.l;
				quad(mT, x0 + 0.022, x0 + BW - 0.022, Math.max(0, yOf(n.t)), yOf(n.t + n.l), on ? 'rgba(255,255,255,0.95)' : 'rgba(215,228,255,0.72)');
			}
		}
		// ---- chips
		for (let lane = 0; lane < 2; lane++) {
			const a = ch.fx[lane], [i0, i1] = range(a), x0 = fxX(lane);
			for (let i = i0; i < i1; i++) {
				const n = a[i]; if (n.l !== 0 || n.t < drawTick - 2) continue;
				const y = yOf(n.t), L = chipLen(y);
				quad(mT, x0 + 0.006, x0 + 2 * BW - 0.006, y, y + L, '#ff8c10');
				quad(mT, x0 + 0.03, x0 + 2 * BW - 0.03, y + L * 0.25, y + L * 0.75, '#ffc060');
			}
		}
		for (let lane = 0; lane < 4; lane++) {
			const a = ch.bt[lane], [i0, i1] = range(a), x0 = btX(lane);
			for (let i = i0; i < i1; i++) {
				const n = a[i]; if (n.l !== 0 || n.t < drawTick - 2) continue;
				const y = yOf(n.t), L = chipLen(y);
				quad(mT, x0 + 0.008, x0 + BW - 0.008, y, y + L, '#ffffff');
				quad(mT, x0 + 0.03, x0 + BW - 0.03, y + L * 0.25, y + L * 0.75, '#d4e2ff');
			}

		const LW = BW, lx = (pos) => (pos - 0.5) * (1 - LW), SLAM_H = LW * 0.9;

				const s = arr[i], end = K.sectionEndTick(s);
				if (end < drawTick - 60) { if (s.t + 960 * 64 < tStart) break; continue; }
				const pts = s.pts;
				for (let k = 0; k < pts.length; k++) {

					}

						const ta = t + (tq - t) * fa, tb = t + (tq - t) * fb;
						if (tb < drawTick) continue;
						const va = p.vf + (q.v - p.vf) * K.evalCurve(p.a, p.b, fa), vb = p.vf + (q.v - p.vf) * K.evalCurve(p.a, p.b, fb);
						let ya = yOf(ta) + (j === 0 && slam ? SLAM_H : 0), yb = yOf(tb);

						if (ya < 0) { const f = -ya / (yb - ya); xa += (xb - xa) * f; ya = 0; }
						if (yb > TL) { const f = (TL - ya) / (yb - ya); xb = xa + (xb - xa) * f; yb = TL; }

					}
				}
				if (nowTick >= s.t && nowTick <= end) { const v = K.laserValueAt(s, Math.floor(nowTick)); if (v !== null) cursors.push([lane, lx(K.laserPos(v, s.wide))]); }
			}
		}
