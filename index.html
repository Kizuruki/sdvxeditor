<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSM Chart Editor</title>
<style>
:root {
	--bg: #121214; --panel: #1c1c1f; --panel2: #232327; --line: #2e2e33; --line2: #3a3a40;
	--text: #d6d6da; --muted: #8b8b93; --dim: #5d5d65;
	--accent: #3aa7d0; --accent2: #2a7fa0; --danger: #e05a5a; --ok: #5ac47a; --warn: #e0b04a;
	--bt: #f2f2f2; --fx: #ff9a1f; --laserL: #2fb8ff; --laserR: #ff3d9a;
	--font: "Segoe UI", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
	--mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12.5px/1.35 var(--font); overflow: hidden; user-select: none; }
#app { display: flex; flex-direction: column; height: 100vh; }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: var(--panel2); border: 1px solid var(--line2); border-radius: 3px; padding: 3px 9px; cursor: pointer; }
button:hover { background: #2d2d33; border-color: #4a4a52; }
button:active { background: #36363d; }
button.on { background: var(--accent2); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
select, input[type=text], input[type=number], textarea { background: #151517; border: 1px solid var(--line2); border-radius: 3px; padding: 3px 5px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
input[type=number] { width: 72px; }
input[type=range] { accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); vertical-align: middle; }
textarea { width: 100%; resize: vertical; font-family: var(--mono); font-size: 11.5px; user-select: text; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.hidden { display: none !important; }
kbd { font: 10.5px var(--mono); background: #2a2a2f; border: 1px solid #3c3c44; border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: #c8c8cc; }

/* menu bar */
#menubar { display: flex; align-items: center; height: 28px; background: #18181b; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.brand { padding: 0 12px; font-weight: 600; color: #fff; letter-spacing: .2px; }
.brand::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 2px; background: linear-gradient(135deg, var(--laserL), var(--laserR)); }
#menus { display: flex; height: 100%; }
.menu { position: relative; height: 100%; }
.menu > .mlabel { height: 100%; display: flex; align-items: center; padding: 0 10px; cursor: default; }
.menu:hover > .mlabel, .menu.open > .mlabel { background: #2a2a30; }
.menu .mlist { display: none; position: absolute; top: 100%; left: 0; min-width: 250px; background: #222226; border: 1px solid var(--line2); box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 50; padding: 4px 0; }
.menu.open .mlist { display: block; }
.mitem { display: flex; justify-content: space-between; gap: 20px; padding: 4px 14px; cursor: default; white-space: nowrap; }
.mitem:hover { background: var(--accent2); color: #fff; }
.mitem .k { color: var(--muted); font-size: 11px; } .mitem:hover .k { color: #e8f6fb; }
.mitem.disabled { opacity: .4; pointer-events: none; }
.msep { height: 1px; background: var(--line2); margin: 4px 0; }
.mitem .chk { width: 14px; display: inline-block; }
.doc-title { margin-left: auto; padding-right: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45vw; }

/* option bar (tool options) */
#optbar { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; overflow-x: auto; white-space: nowrap; }
#optbar .grp { display: flex; align-items: center; gap: 5px; }
#optbar .sep { width: 1px; height: 20px; background: var(--line2); }
#optbar label { color: var(--muted); }
#optbar .hint { color: var(--dim); margin-left: auto; padding-left: 12px; }

/* main area */
#main { flex: 1; display: flex; min-height: 0; }
#previewPane { position: relative; width: 320px; flex-shrink: 0; display: flex; flex-direction: column; background: #000; border-right: 1px solid var(--line); }
#pvResize { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: ew-resize; z-index: 5; }
#pvResize:hover, #pvResize.on { background: rgba(120,160,255,0.25); }
.pv-speed { display: flex; align-items: center; gap: 3px; font-weight: 400; }
.pv-speed button { padding: 0 6px; min-width: 0; height: 18px; line-height: 16px; }
.pv-speed input { width: 46px; height: 18px; padding: 0 4px; text-align: center; }
.pv-speed .lbl { color: var(--muted); font-size: 11px; cursor: pointer; }
#previewPane canvas { flex: 1; width: 100%; min-height: 0; display: block; }
.pane-head { display: flex; justify-content: space-between; padding: 4px 8px; background: var(--panel); border-bottom: 1px solid var(--line); font-weight: 600; }
.pane-head .muted { font-weight: 400; font-size: 11px; }
#toolbox { width: 46px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 4px; }
.tool { width: 36px; height: 36px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.tool svg { width: 20px; height: 20px; }
.tool .kk { position: absolute; right: 2px; bottom: 0; font-size: 9px; color: var(--muted); }
.tool.on .kk { color: #e8f6fb; }
#toolbox .sep { width: 28px; height: 1px; background: var(--line2); margin: 3px 0; }
#timelineWrap { flex: 1; position: relative; min-width: 0; background: #0e0e11; }
#timeline { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#dropHint { position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 8px; display: none; align-items: center; justify-content: center; font-size: 16px; color: var(--accent); background: rgba(10,30,40,.6); pointer-events: none; }
#timelineWrap.drop #dropHint { display: flex; }

/* side panel */
#side { width: 310px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }
#tabs { display: flex; border-bottom: 1px solid var(--line); flex-shrink: 0; }
#tabs button { flex: 1; border: none; border-radius: 0; background: transparent; padding: 6px 2px; color: var(--muted); border-bottom: 2px solid transparent; }
#tabs button.on { color: #fff; border-bottom-color: var(--accent); background: #26262b; }
#tabs .badge { display: inline-block; min-width: 15px; padding: 0 4px; margin-left: 3px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; }
#tabBody { flex: 1; overflow-y: auto; padding: 8px 10px 16px; user-select: text; }
#tabBody::-webkit-scrollbar { width: 8px; } #tabBody::-webkit-scrollbar-thumb { background: #34343a; border-radius: 4px; }
.sec { margin-bottom: 12px; }
.sec h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 3px; font-weight: 600; }
.row { display: grid; grid-template-columns: 108px 1fr; align-items: center; gap: 6px; margin: 4px 0; }
.row > label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row > .ctl { display: flex; gap: 4px; align-items: center; min-width: 0; }
.row > .ctl > input[type=text], .row > .ctl > select { flex: 1; width: 100%; }
.row.wide { grid-template-columns: 1fr; }
.btns { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.note { color: var(--muted); font-size: 11.5px; margin: 4px 0 8px; }
.tag { display: inline-block; padding: 0 6px; border-radius: 3px; background: #2b2b31; font-size: 11px; }
.tag.bt { background: #4a4a4a; color: #fff; } .tag.fx { background: #6b3f08; color: #ffd39b; }
.tag.ll { background: #0b4767; color: #a7e2ff; } .tag.lr { background: #6a1640; color: #ffc0dc; }
.list { border: 1px solid var(--line); border-radius: 3px; max-height: 340px; overflow-y: auto; }
.li { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-bottom: 1px solid #26262a; cursor: pointer; }
.li:hover { background: #2a2a30; }
.li .t { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 64px; }
.li .msg { flex: 1; }
.li .x { border: none; background: none; color: var(--dim); padding: 0 4px; }
.li .x:hover { color: var(--danger); }
.lvl-error { color: #ff8080; } .lvl-warn { color: var(--warn); } .lvl-info { color: var(--muted); }

/* transport */
#transport { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; background: #18181b; border-top: 1px solid var(--line); flex-shrink: 0; white-space: nowrap; overflow-x: auto; }
#transport .sep { width: 1px; height: 22px; background: var(--line2); }
#transport .time { font: 15px var(--mono); color: #fff; min-width: 92px; }
#transport .pos { font: 12px var(--mono); color: var(--muted); min-width: 120px; }
#transport label { color: var(--muted); }
#transport button.play { width: 34px; }
#transport .spacer { flex: 1; }
.ibtn svg { width: 14px; height: 14px; vertical-align: -2px; }

/* popover / modal / toast */
.popover { position: fixed; z-index: 80; background: #232328; border: 1px solid var(--accent2); border-radius: 5px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.55); min-width: 200px; user-select: text; }
.popover h5 { margin: 0 0 6px; font-size: 12px; }
.popover .row { grid-template-columns: 80px 1fr; }
.modal { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
.modal-box { width: min(760px, 94vw); max-height: 86vh; display: flex; flex-direction: column; background: #1e1e22; border: 1px solid var(--line2); border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
.modal-head .x { border: none; background: none; font-size: 18px; padding: 0 6px; }
#modalBody { padding: 10px 14px 14px; overflow-y: auto; user-select: text; }
#modalBody table { border-collapse: collapse; width: 100%; }
#modalBody td { padding: 3px 6px; border-bottom: 1px solid #2a2a2e; vertical-align: top; }
#modalBody td:first-child { white-space: nowrap; color: var(--muted); width: 1%; }
#modalBody h3 { margin: 12px 0 6px; font-size: 13px; color: var(--accent); scroll-margin-top: 4px; }
#modalBody pre { background: #141417; border: 1px solid #2a2a2e; border-radius: 4px; padding: 6px 8px; overflow-x: auto; font-size: 11.5px; }
#modalBody a { color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 95; background: #26262c; border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 7px 14px; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: 70vw; }
.toast.err { border-left-color: var(--danger); }
.banner { background: #1d3340; border: 1px solid var(--accent2); border-radius: 4px; padding: 8px; margin-bottom: 10px; }

@media (max-width: 1100px) { #previewPane { width: 220px; } #side { width: 270px; } }
@media (max-width: 820px) { #previewPane { display: none; } }

.warnlist { margin: 6px 0 10px 18px; padding: 0; max-height: 50vh; overflow: auto; }
.warnlist li { margin: 3px 0; color: var(--text); }
.sdvx-export .row > label { width: 120px; }

</style>
</head>
<body>
<div id="app">
	<header id="menubar">
		<div class="brand">KSM Chart Editor</div>
		<nav id="menus"></nav>
		<div id="docTitle" class="doc-title"></div>
	</header>
	<div id="optbar"></div>
	<main id="main">
		<aside id="previewPane">
			<div class="pane-head"><span>Preview</span><span id="pvSpeed" class="pv-speed"></span></div>
			<canvas id="preview"></canvas>
			<div id="pvResize" title="Drag to resize the preview"></div>
		</aside>
		<div id="toolbox"></div>
		<section id="timelineWrap">
			<canvas id="timeline" tabindex="0"></canvas>
			<div id="dropHint">Drop a .ksh or .vox chart and/or audio file</div>
		</section>
		<aside id="side">
			<div id="tabs"></div>
			<div id="tabBody"></div>
		</aside>
	</main>
	<footer id="transport"></footer>
</div>
<div id="popover" class="popover hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><span id="modalTitle"></span><button class="x" data-close>&times;</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="fileInput" multiple hidden accept=".ksh,.kson,.ogg,.mp3,.wav,.flac,.m4a,.opus,.aac,audio/*">
<script>
/* ============================================================================
 * KSM Chart Editor - core
 * Chart model, timing math and KSH (K-Shoot MANIA) import/export.
 * Pure logic, no DOM, so it can be unit-tested in Node and ported to C++.
 *
 * KSH semantics follow libkson (github.com/kshootmania/libkson) KshIOIn/KshIOOut:
 *   - 240 ticks per beat (960 per 4/4 measure), same as KSON "pulses"
 *   - laser positions are integers 0..50 (KSH characters 0-9A-Za-o)
 *   - a laser point with v != vf is a slam; in KSH it is written as a 1/32 segment
 * ========================================================================== */
(function (root) {
'use strict';

const RES = 240;               // ticks per beat
const MEAS4 = RES * 4;         // ticks per 4/4 measure
const LASER_MAX = 50;
const SLAM_LEN = MEAS4 / 32;   // 30 ticks - KSH laser segments this short are slams
const KSH_LEN = MEAS4 / 192;   // 5 ticks - KSH lengths (stop, spin) use 192 per measure

let _nextId = 1;
const nid = () => _nextId++;

const CAM_KEYS = ['zoom_top', 'zoom_bottom', 'zoom_side', 'center_split', 'rotation_deg', 'scroll_speed'];
const TILT_AUTO = ['normal', 'bigger', 'biggest', 'keep_normal', 'keep_bigger', 'keep_biggest', 'zero'];

// Header keys in the order libkson / KSM write them
const HEADER_KEYS = ['title', 'title_translit', 'title_img', 'artist', 'artist_translit', 'artist_img', 'effect',
	'jacket', 'illustrator', 'difficulty', 'level', 't', 'to', 'm', 'mvol', 'o', 'bg', 'layer', 'v', 'vo', 'po',
	'plength', 'pfiltergain', 'filtertype', 'chokkakuautovol', 'chokkakuvol', 'pfilterdelay', 'total', 'information',
	'icon', 'ver', 'ver_compat'];

// FX hold audio effects. "params" are the ;-separated values after the name.
const FX_EFFECTS = [
	{ name: 'Retrigger', params: [{ label: 'Wave 1/n', def: 8 }] },
	{ name: 'Gate', params: [{ label: 'Wave 1/n', def: 4 }] },
	{ name: 'Flanger', params: [] },
	{ name: 'PitchShift', params: [{ label: 'Pitch (12=1oct)', def: 12 }] },
	{ name: 'BitCrusher', params: [{ label: 'Reduction', def: 5 }] },
	{ name: 'Phaser', params: [] },
	{ name: 'Wobble', params: [{ label: 'Wave 1/n', def: 12 }] },
	{ name: 'TapeStop', params: [{ label: 'Speed', def: 50 }] },
	{ name: 'Echo', params: [{ label: 'Wave 1/n', def: 4 }, { label: 'Feedback %', def: 60 }] },
	{ name: 'SideChain', params: [] },
];
const LEGACY_FX_CHARS = {
	S: 'Retrigger;8', V: 'Retrigger;12', T: 'Retrigger;16', W: 'Retrigger;24', U: 'Retrigger;32',
	G: 'Gate;4', H: 'Gate;8', K: 'Gate;12', I: 'Gate;16', L: 'Gate;24', J: 'Gate;32',
	F: 'Flanger', P: 'PitchShift;12', B: 'BitCrusher;5', Q: 'Phaser', X: 'Wobble;12', A: 'TapeStop', D: 'SideChain',
};
const FX_WITH_PARAM = new Set(['Retrigger', 'Gate', 'Wobble', 'PitchShift', 'BitCrusher', 'TapeStop', 'Echo']);
const LASER_FILTERS = ['peak', 'lpf1', 'hpf1', 'bitc', 'fx', 'fx;bitc'];
const SLAM_SOUNDS = ['up', 'down', 'swing', 'mute'];
const FX_CHIP_SOUNDS = ['clap', 'clap_punchy', 'clap_impact', 'snare', 'snare_lo'];
const BG_PRESETS = ['desert', 'grass', 'night', 'deepsea', 'sky', 'sunset', 'ocean', 'flame', 'cyber', 'space', 'mars', 'cloudy', 'fantasy'];
const LAYER_PRESETS = ['arrow', 'smoke', 'wave', 'techno', 'snow', 'sakura', 'hidden'];
const DIFFICULTIES = ['light', 'challenge', 'extended', 'infinite'];

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------
function lowerBound(arr, t) { // first index with arr[i].t >= t
	let lo = 0, hi = arr.length;
	while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid].t < t) lo = mid + 1; else hi = mid; }
	return lo;
}
function upperBound(arr, t) { // first index with arr[i].t > t
	let lo = 0, hi = arr.length;
	while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid].t <= t) lo = mid + 1; else hi = mid; }
	return lo;
}
function lastAtOrBefore(arr, t) { const i = upperBound(arr, t) - 1; return i >= 0 ? arr[i] : null; }
function findAt(arr, t) { const i = lowerBound(arr, t); return (i < arr.length && arr[i].t === t) ? arr[i] : null; }
function insertSorted(arr, obj) { arr.splice(upperBound(arr, obj.t), 0, obj); return obj; }
function sortByT(arr) { return arr.sort((a, b) => a.t - b.t); }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function round3(v) { return Math.round(v * 1000) / 1000; }
function fmtNum(v) { // libkson FormatDouble: 3 decimals, trailing zeros removed
	v = round3(v);
	let s = v.toFixed(3);
	s = s.replace(/0+$/, '').replace(/\.$/, '');
	if (s === '-0') s = '0';
	return s;
}
function parseIntKsh(s, def = 0) { const v = parseInt(String(s).trim(), 10); return Number.isFinite(v) ? v : def; }
function parseFloatKsh(s, def = 0) { const v = parseFloat(String(s).trim()); return Number.isFinite(v) ? v : def; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function charToLaserX(c) {
	if (c >= '0' && c <= '9') return c.charCodeAt(0) - 48;
	if (c >= 'A' && c <= 'Z') return c.charCodeAt(0) - 65 + 10;
	if (c >= 'a' && c <= 'o') return c.charCodeAt(0) - 97 + 36;
	return 0;
}
function laserXToChar(x) {
	if (x >= 0 && x <= 9) return String.fromCharCode(48 + x);
	if (x >= 10 && x <= 35) return String.fromCharCode(65 + x - 10);
	if (x >= 36 && x <= 50) return String.fromCharCode(97 + x - 36);
	return '0';
}
// Laser value (0..50) to horizontal track position (0 = left knob lane centre, 1 = right knob lane centre)
function laserPos(v, wide) {
	if (!wide) return v / LASER_MAX;
	let g = v / LASER_MAX;
	if (v === 12) g = 0.25; else if (v === 37) g = 0.75; // libkson wide-laser zero fix
	return (g - 0.5) * 2 + 0.5;
}
function posToLaserX(pos, wide) { // inverse of laserPos, rounded to the KSH grid
	const g = wide ? (pos - 0.5) / 2 + 0.5 : pos;
	if (wide) {
		if (Math.abs(g - 0.25) < 0.005) return 12;
		if (Math.abs(g - 0.75) < 0.005) return 37;
	}
	return clamp(Math.round(g * LASER_MAX), 0, LASER_MAX);
}

// Quadratic bezier easing used by KSH/KSON curves (port of libkson EvaluateCurve)
function evalCurve(a, b, x) {
	if (Math.round(a * 1e8) === Math.round(b * 1e8)) return x; // linear
	a = clamp(a, 0, 1); b = clamp(b, 0, 1); x = clamp(x, 0, 1);
	const disc = a * a + x - 2 * a * x;
	const dSqrt = disc >= 0 ? Math.sqrt(disc) : 0;
	const t = a < 0.25 ? (a - dSqrt) / (-1 + 2 * a) : x / (a + dSqrt);
	return clamp(2 * (1 - t) * t * b + t * t, 0, 1);
}
const CURVE_PRESETS = [
	{ id: 'linear', label: 'Linear', a: 0, b: 0 },
	{ id: 'in', label: 'Ease in', a: 0.5, b: 0 },
	{ id: 'out', label: 'Ease out', a: 0.5, b: 1 },
	{ id: 'in2', label: 'Strong in', a: 1, b: 0 },
	{ id: 'out2', label: 'Strong out', a: 0, b: 1 },
];
function isLinear(p) { return !p.a && !p.b || Math.round(p.a * 1e8) === Math.round(p.b * 1e8); }

// ---------------------------------------------------------------------------
// Chart model
// ---------------------------------------------------------------------------
function newChart() {
	const meta = {};
	for (const k of HEADER_KEYS) meta[k] = '';
	Object.assign(meta, {
		difficulty: 'challenge', level: '1', o: '0', bg: 'desert', layer: 'arrow', po: '0', plength: '15000',
		pfiltergain: '50', filtertype: 'peak', chokkakuautovol: '0', chokkakuvol: '50',
	});
	return {
		meta,
		metaExtra: [],                 // unknown header [key, value]
		bt: [[], [], [], []],          // {id, t, l}  l = 0 chip, > 0 hold length
		fx: [[], []],                  // {id, t, l, fx?: effect string for holds, se?: "name;vol" for chips}
		laser: [[], []],               // {id, t, wide, pts: [{id, ry, v, vf, a, b}]}
		bpm: [{ id: nid(), t: 0, v: 120 }],
		sig: [{ id: nid(), m: 0, n: 4, d: 4 }],
		stops: [],                     // {id, t, l}
		cam: { zoom_top: [], zoom_bottom: [], zoom_side: [], center_split: [], rotation_deg: [], scroll_speed: [] },
		tilt: [],                      // {id, t, v: number|auto string, vf?: number|string, a, b}
		spins: [],                     // {id, t, kind: 'spin'|'half'|'swing', dir: -1|1, l (ticks), amp, rep, dec}
		slamSE: [],                    // {id, t, v}  chokkakuse

	peakAt(t0, t1) {

	play(songTime, rate) {
		const ctx = this.ensure();

			this.workletPlaying = true;
		} else if (this.buffer && songTime < this.buffer.duration) {
			const src = ctx.createBufferSource();
			src.buffer = this.buffer;
			src.playbackRate.value = this.rate;
			src.connect(this.musicGain);
			if (songTime >= 0) src.start(when, songTime);
			else src.start(when + (-songTime) / this.rate, 0);
			this.src = src;
		}
		this.playing = true;
	}
	stop() {
		if (this.src) { try { this.src.stop(); } catch (e) { } this.src.disconnect(); this.src = null; }
		if (this.workletPlaying && this.fxNode) { this.fxNode.port.postMessage({ cmd: 'stop' }); this.workletPlaying = false; }
		for (const s of this.scheduled) { try { s.stop(); } catch (e) { } }
		this.scheduled = [];
		this.playing = false;
	}
	// Context time that is audible right now (output latency compensated), smoothed
	_audibleCtxTime() {
		const ctx = this.ctx, perf = performance.now() / 1000;
		let est;
		if (ctx.getOutputTimestamp) {
			const ts = ctx.getOutputTimestamp();
			if (ts && ts.contextTime > 0 && ts.performanceTime > 0) est = ts.contextTime + (perf - ts.performanceTime / 1000);
		}

	}
	songTimeNow() {
		if (!this.playing) return null;
		let s = this.t0Song + (this._audibleCtxTime() - this.t0Ctx) * this.rate - this.userLatency;
		if (s < this.lastSong && this.lastSong - s < 0.03) s = this.lastSong; // keep monotonic
		this.lastSong = s;
		return s;
	}
	// Context time at which a given song time will be heard
	ctxTimeFor(songTime) { return this.t0Ctx + (songTime - this.t0Song) / this.rate; }
	schedule(kind, songTime, gain, bus) {
		const ctx = this.ctx; if (!ctx || !this.playing) return;
		const when = this.ctxTimeFor(songTime);
		if (when < ctx.currentTime - 0.002) return;

		if (gain !== undefined && gain !== 1) { const g = ctx.createGain(); g.gain.value = gain; s.connect(g); node = g; }
		node.connect(kind === 'metro' || kind === 'metroHi' ? this.metroGain : bus === 'game' ? this.gameGain : this.hitGain);
		s.start(Math.max(when, ctx.currentTime));
		s.onended = () => { const i = this.scheduled.indexOf(s); if (i >= 0) this.scheduled.splice(i, 1); };
		this.scheduled.push(s);
	}
	click() { // UI feedback sound when placing notes (not timing critical)
		if (!this.ctx || !this.sounds) return;
		const s = this.ctx.createBufferSource(); s.buffer = this.sounds.bt;
		const g = this.ctx.createGain(); g.gain.value = 0.35; s.connect(g); g.connect(this.hitGain); s.start();
	}

	_makeSounds() {
		const sr = this.ctx.sampleRate;
		const mk = (dur, fn) => {
			const n = Math.ceil(sr * dur), b = this.ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
			let seed = 1234567;
			const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x3fffffff - 1; };
			for (let i = 0; i < n; i++) d[i] = fn(i / sr, rnd);
			return b;
		};
		return {
			// bright click/clap for BT
			bt: mk(0.06, (t, r) => { const e = Math.exp(-t * 70); return (r() * 0.55 + Math.sin(2 * Math.PI * 2400 * t) * 0.45) * e * 0.9; }),
			// lower, fuller clap for FX
			fx: mk(0.09, (t, r) => { const e = Math.exp(-t * 45); return (r() * 0.6 + Math.sin(2 * Math.PI * 900 * t) * 0.5) * e * 0.9; }),
			// laser slams (chokkakuse: normal / up / down / swing)
			slam_normal: mk(0.16, (t, r) => { const e = Math.exp(-t * 22) * Math.min(1, t * 400); return r() * e * 0.8 + Math.sin(2 * Math.PI * (500 - t * 1800) * t) * e * 0.4; }),
			slam_up: mk(0.18, (t, r) => { const e = Math.exp(-t * 18) * Math.min(1, t * 400); return r() * e * 0.45 + Math.sin(2 * Math.PI * (300 + t * 2600) * t) * e * 0.6; }),
			slam_down: mk(0.2, (t, r) => { const e = Math.exp(-t * 16) * Math.min(1, t * 400); return r() * e * 0.45 + Math.sin(2 * Math.PI * (900 - t * 2200) * t) * e * 0.6; }),
			slam_swing: mk(0.3, (t, r) => { const e = Math.sin(Math.PI * Math.min(1, t / 0.3)) * Math.exp(-t * 6); return r() * e * 0.7; }),
			// FX chip key sounds (fx-l_se / fx-r_se)
			se_clap: mk(0.22, (t, r) => { const b = (k) => Math.max(0, 1 - Math.abs(t - k) * 200); const e = Math.exp(-t * 18) + b(0.008) + b(0.016); return r() * Math.min(1.2, e) * 0.7; }),
			se_clap_punchy: mk(0.18, (t, r) => { const e = Math.exp(-t * 28); return r() * e * 0.8 + Math.sin(2 * Math.PI * 180 * t) * Math.exp(-t * 40) * 0.5; }),
			se_clap_impact: mk(0.3, (t, r) => { const e = Math.exp(-t * 12); return r() * e * 0.75 + Math.sin(2 * Math.PI * (120 - t * 100) * t) * Math.exp(-t * 15) * 0.7; }),
			se_snare: mk(0.25, (t, r) => { const e = Math.exp(-t * 16); return r() * e * 0.6 + Math.sin(2 * Math.PI * 220 * t) * Math.exp(-t * 30) * 0.5; }),
			se_snare_lo: mk(0.28, (t, r) => { const e = Math.exp(-t * 13); return r() * e * 0.5 + Math.sin(2 * Math.PI * 150 * t) * Math.exp(-t * 25) * 0.6; }),
			metro: mk(0.04, (t) => Math.sin(2 * Math.PI * 1500 * t) * Math.exp(-t * 90) * 0.8),
			metroHi: mk(0.05, (t) => Math.sin(2 * Math.PI * 2300 * t) * Math.exp(-t * 80) * 0.9),
		};
	}
}

<script>
const K = window.KSMCore;
const UI_FONT = '"Segoe UI", system-ui, -apple-system, sans-serif';

/* ============================================================================
 * Timeline view: geometry + rendering of the MMW-style vertical chart timeline.
 * Time flows upward. Only visible objects are drawn (binary search per lane).
 * ========================================================================== */
const COL_INFO = {
	zoom_top: { label: 'Zoom Top', short: 'ZT', range: 300, color: '#b48cff' },
	zoom_bottom: { label: 'Zoom Bottom', short: 'ZB', range: 300, color: '#8cb4ff' },
	zoom_side: { label: 'Zoom Side', short: 'ZS', range: 300, color: '#8cffc8' },
	tilt: { label: 'Tilt', short: 'TL', range: 1, color: '#ffd28c' },
	rotation_deg: { label: 'Rotation°', short: 'RO', range: 180, color: '#ff8cb4' },
	center_split: { label: 'Split', short: 'CS', range: 300, color: '#c8ff8c' },
	scroll_speed: { label: 'Scroll Spd', short: 'SS', range: 2, color: '#8cf0ff' },
};
const ALL_COLS = ['zoom_top', 'zoom_bottom', 'zoom_side', 'tilt', 'rotation_deg', 'center_split', 'scroll_speed'];

class TimelineView {
	constructor(canvas, ed) {
		this.cv = canvas; this.ctx = canvas.getContext('2d', { alpha: false });
		this.ed = ed;
		this.HEAD = 22;
		this.zoom = 1;          // px per tick = 0.25 * zoom
		this.bottomTick = -120; // tick at the bottom edge (below the header-free area)
		this.w = 0; this.h = 0; this.dpr = 1;
		this.cols = [];
		this.resize();
	}
	get ppt() { return 0.25 * this.zoom; }
	resize() {
		const r = this.cv.getBoundingClientRect();
		this.dpr = window.devicePixelRatio || 1;
		this.w = Math.max(100, Math.floor(r.width)); this.h = Math.max(100, Math.floor(r.height));
		this.cv.width = Math.floor(this.w * this.dpr); this.cv.height = Math.floor(this.h * this.dpr);
		this.layout();
	}
	layout() {
		const S = this.ed.settings;
		const G = 54, W = S.showWave ? 54 : 0;
		this.gutterR = G; this.waveL = G; this.waveR = G + W;
		this.laneW = S.laneW;
		this.trackL = this.waveR + 10;
		this.trackR = this.trackL + this.laneW * 6;
		this.timingL = this.trackR + 10; this.timingR = this.timingL + 104;
		const vis = ALL_COLS.filter(k => S.cols[k]);
		const avail = this.w - this.timingR - 6;
		const cw = vis.length ? Math.max(46, Math.min(84, Math.floor(avail / vis.length))) : 0;
		this.cols = vis.map((k, i) => ({ key: k, l: this.timingR + 6 + i * cw, r: this.timingR + 6 + (i + 1) * cw - 4 }));
		this.rangeCache = null;
	}
	// ---- geometry ----
	yOf(t) { return this.h - (t - this.bottomTick) * this.ppt; }
	tickAt(y) { return this.bottomTick + (this.h - y) / this.ppt; }
	btL(lane) { return this.trackL + this.laneW * (lane + 1); }
	fxL(lane) { return this.trackL + this.laneW * (1 + lane * 2); }
	laserX(v) { return this.trackL + this.laneW * 0.5 + (v / 50) * this.laneW * 5; }
	vAtX(x) { return (x - this.trackL - this.laneW * 0.5) / (this.laneW * 5) * 50; }
	region(x) {
		if (x < this.gutterR) return { kind: 'gutter' };
		if (x < this.waveR) return { kind: 'wave' };
		if (x < this.trackR + 6) return { kind: 'track' };
		if (x < this.timingR + 3) return { kind: 'timing' };
		for (const c of this.cols) if (x >= c.l - 2 && x <= c.r + 2) return { kind: 'cam', key: c.key, col: c };
		return { kind: 'none' };
	}
	colRange(key) {
		const pts = key === 'tilt' ? this.ed.chart.tilt : this.ed.chart.cam[key];
		let mx = COL_INFO[key].range;
		for (const p of pts) { for (const v of [p.v, p.vf]) if (typeof v === 'number') mx = Math.max(mx, Math.abs(v) * 1.1); }
		return mx;
	}
	colX(col, v) { const R = this._ranges[col.key]; const c = (col.l + col.r) / 2; return c + (v / R) * ((col.r - col.l) / 2 - 3); }
	colV(col, x) { const R = this._ranges[col.key]; const c = (col.l + col.r) / 2; return (x - c) / ((col.r - col.l) / 2 - 3) * R; }
	visibleRange() { return [Math.floor(this.tickAt(this.h + 10)), Math.ceil(this.tickAt(this.HEAD - 10))]; }

	// ---- rendering ----
	draw() {
		const ed = this.ed, c = this.ctx, ch = ed.chart, tm = ed.timing;
		c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
		c.fillStyle = '#0e0e11'; c.fillRect(0, 0, this.w, this.h);
		this._ranges = {}; for (const col of this.cols) this._ranges[col.key] = this.colRange(col.key);
		const [t0, t1] = this.visibleRange();
		const L = this.laneW, tl = this.trackL, tr = this.trackR;

		// track background
		c.fillStyle = '#131317'; c.fillRect(tl, 0, tr - tl, this.h);
		c.fillStyle = 'rgba(47,184,255,0.07)'; c.fillRect(tl, 0, L, this.h);
		c.fillStyle = 'rgba(255,61,154,0.07)'; c.fillRect(tr - L, 0, L, this.h);
		c.fillStyle = '#16161b'; c.fillRect(this.btL(1), 0, L, this.h); c.fillRect(this.btL(3), 0, L, this.h);
		c.fillStyle = '#101013'; c.fillRect(this.timingL, 0, this.timingR - this.timingL, this.h);
		for (const col of this.cols) { c.fillStyle = '#111115'; c.fillRect(col.l, 0, col.r - col.l, this.h); }

		// waveform
		if (ed.settings.showWave && ed.audio.peaks) this._drawWave(t0, t1);

		// stops (hatched bands)
		for (const s of ch.stops) {
			if (s.t + s.l < t0 || s.t > t1) continue;
			const y0 = this.yOf(s.t), y1 = this.yOf(s.t + s.l);
			c.fillStyle = 'rgba(255,80,80,0.08)'; c.fillRect(tl, y1, tr - tl, y0 - y1);
		}

		this._drawGrid(t0, t1);

		// lane dividers
		c.lineWidth = 1;
		c.strokeStyle = '#2a2a33'; c.beginPath();
		for (let i = 1; i < 6; i++) { if (i === 3) continue; const x = Math.round(tl + L * i) + 0.5; c.moveTo(x, 0); c.lineTo(x, this.h); }
		c.stroke();
		c.strokeStyle = '#3c3c48'; c.beginPath();
		for (const x0 of [tl, tl + L * 3, tr]) { const x = Math.round(x0) + 0.5; c.moveTo(x, 0); c.lineTo(x, this.h); }
		c.stroke();
		for (const col of this.cols) { // zero line
			const x = Math.round(this.colX(col, 0)) + 0.5;
			c.strokeStyle = '#26262e'; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, this.h); c.stroke();
		}

		this._drawNotes(t0, t1);
		this._drawLasers(t0, t1);
		this._drawSpins(t0, t1);
		this._drawTimingCol(t0, t1);
		for (const col of this.cols) this._drawCamCol(col, t0, t1);
		ed.drawOverlay(c, this);   // ghosts, marquee, hover highlights

		// playhead
		const ph = ed.playing ? ed.playTick : ed.cursor;
		const py = Math.round(this.yOf(ph)) + 0.5;
		c.strokeStyle = '#ff4f4f'; c.lineWidth = 2; c.beginPath(); c.moveTo(this.waveL, py); c.lineTo(this.w, py); c.stroke();
		c.fillStyle = '#ff4f4f'; c.beginPath(); c.moveTo(this.gutterR - 10, py - 6); c.lineTo(this.gutterR - 10, py + 6); c.lineTo(this.gutterR - 1, py); c.fill();
		c.lineWidth = 1;

		// header band
		c.fillStyle = '#18181c'; c.fillRect(0, 0, this.w, this.HEAD);
		c.strokeStyle = '#2e2e35'; c.beginPath(); c.moveTo(0, this.HEAD - 0.5); c.lineTo(this.w, this.HEAD - 0.5); c.stroke();
		c.font = '600 10.5px ' + UI_FONT;
		c.textBaseline = 'middle'; c.textAlign = 'center';
		const hy = this.HEAD / 2 + 1;
		c.fillStyle = '#7a7a84'; c.fillText('MEAS', this.gutterR / 2, hy);
		if (ed.settings.showWave) c.fillText('WAVE', (this.waveL + this.waveR) / 2, hy);
		const lab = [['L', '#2fb8ff'], ['A', '#ddd'], ['B', '#ddd'], ['C', '#ddd'], ['D', '#ddd'], ['R', '#ff3d9a']];
		lab.forEach(([s, col], i) => { c.fillStyle = col; c.fillText(s, tl + L * (i + 0.5), hy); });
		c.fillStyle = '#9ad68a'; c.fillText('BPM · BEAT · STOP', (this.timingL + this.timingR) / 2, hy);
		for (const col of this.cols) {
			c.fillStyle = COL_INFO[col.key].color;
			const w = col.r - col.l;
			c.fillText(w > 70 ? COL_INFO[col.key].label : COL_INFO[col.key].short, (col.l + col.r) / 2, hy);
		}
		c.textAlign = 'left';
	}

	_drawWave(t0, t1) {
		const c = this.ctx, ed = this.ed, a = ed.audio;
		const off = ed.offsetSec(), cx = (this.waveL + this.waveR) / 2, hw = (this.waveR - this.waveL) / 2 - 2;
		c.fillStyle = '#0b0b0e'; c.fillRect(this.waveL, 0, this.waveR - this.waveL, this.h);
		c.fillStyle = '#3d7f99';
		const step = 2;
		for (let y = this.HEAD; y < this.h; y += step) {
			const ta = this.tickAt(y + step), tb = this.tickAt(y);
			if (tb < 0 && ta < 0) continue;
			const sa = ed.timing.tickToSec(ta) + off, sb = ed.timing.tickToSec(tb) + off;
			if (sb < 0 || sa > a.duration) continue;
			const p = Math.min(1, a.peakAt(sa, sb) * 1.15);
			const w = p * hw;
			if (w > 0.3) c.fillRect(cx - w, y, w * 2, step);
		}
	}

	_drawGrid(t0, t1) {
		const c = this.ctx, ed = this.ed, tm = ed.timing;
		const div = ed.div;
		const step = 960 / div;
		let ms = tm.measureOf(Math.max(0, t0));
		const font = UI_FONT;
		const xL = this.waveR, xR = this.timingR;
		const divPx = step * this.ppt;
		let guard = 0;
		while (ms.start <= t1 && guard++ < 400) {
			const beatLen = 960 / ms.d;
			// division lines
			if (divPx >= 4) {
				c.strokeStyle = '#1d1d24'; c.beginPath();
				for (let k = 1; k * step < ms.len; k++) {
					const t = ms.start + k * step;
					if (t < t0 || t > t1 || (k * step) % beatLen === 0) continue;
					const y = Math.round(this.yOf(t)) + 0.5;
					c.moveTo(this.trackL, y); c.lineTo(this.trackR, y);
				}
				c.stroke();
			}
			// beat lines
			c.strokeStyle = '#30303a'; c.beginPath();
			for (let k = 1; k * beatLen < ms.len; k++) {
				const y = Math.round(this.yOf(ms.start + k * beatLen)) + 0.5;
				c.moveTo(xL, y); c.lineTo(xR, y);
			}
			c.stroke();
			// measure line + label
			const y = Math.round(this.yOf(ms.start)) + 0.5;
			c.strokeStyle = '#5c5c6c'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, y); c.lineTo(this.w, y); c.stroke(); c.lineWidth = 1;
			c.fillStyle = '#b8b8c4'; c.font = '600 12px ' + font; c.textBaseline = 'bottom'; c.textAlign = 'right';
			c.fillText(String(ms.m + 1), this.gutterR - 6, y - 2);
			c.fillStyle = '#5c5c68'; c.font = '10px ' + font; c.textBaseline = 'top';
			c.fillText(fmtTime(tm.tickToSec(ms.start)), this.gutterR - 4, y + 2);
			c.textAlign = 'left';
			const next = ms.start + ms.len;
			ms = tm.measureOf(next);
			if (ms.start < next) break;
		}
	}

	_laneRange(arr, t0, t1) { // indices [i0, i1) of items that may be visible
		let i0 = K.lowerBound(arr, t0);
		while (i0 > 0 && arr[i0 - 1].t + (arr[i0 - 1].l || 0) >= t0) i0--;
		return [i0, K.upperBound(arr, t1)];
	}

	_drawNotes(t0, t1) {
		const c = this.ctx, ed = this.ed, ch = ed.chart, L = this.laneW, sel = ed.sel;
		const font = UI_FONT;
		// FX holds
		for (let lane = 0; lane < 2; lane++) {
			const arr = ch.fx[lane], [i0, i1] = this._laneRange(arr, t0, t1), x = this.fxL(lane);
			for (let i = i0; i < i1; i++) {
				const n = arr[i]; if (n.l <= 0) continue;
				const y0 = this.yOf(n.t), y1 = this.yOf(n.t + n.l);
				c.fillStyle = 'rgba(255,150,30,0.42)'; c.fillRect(x + 3, y1, L * 2 - 6, y0 - y1);
				c.strokeStyle = sel.has(n.id) ? '#7fe4ff' : '#ffae45'; c.lineWidth = sel.has(n.id) ? 2 : 1.2;
				c.strokeRect(x + 3.5, y1 + 0.5, L * 2 - 7, y0 - y1 - 1);
				c.fillStyle = '#ffb24d'; c.fillRect(x + 3, y0 - 3, L * 2 - 6, 3);
				if (n.fx && y0 - y1 > 16) {
					c.fillStyle = '#ffe2b8'; c.font = '10px ' + font; c.textBaseline = 'bottom';
					c.save(); c.beginPath(); c.rect(x + 4, y1, L * 2 - 8, y0 - y1); c.clip();
					c.fillText(n.fx, x + 6, y0 - 5); c.restore();
				}
			}
		}
		c.lineWidth = 1;
		// BT holds
		for (let lane = 0; lane < 4; lane++) {
			const arr = ch.bt[lane], [i0, i1] = this._laneRange(arr, t0, t1), x = this.btL(lane);
			for (let i = i0; i < i1; i++) {
				const n = arr[i]; if (n.l <= 0) continue;
				const y0 = this.yOf(n.t), y1 = this.yOf(n.t + n.l);
				c.fillStyle = 'rgba(235,235,240,0.5)'; c.fillRect(x + 7, y1, L - 14, y0 - y1);

					}
				}
				if (nowTick >= s.t && nowTick <= end) { const v = K.laserValueAt(s, Math.floor(nowTick)); if (v !== null) cursors.push([lane, lx(K.laserPos(v, s.wide))]); }
			}
		}
		c.globalCompositeOperation = 'source-over';
		// far fade
		const fa = P(mT, 0, TL * 0.72), fb = P(mT, 0, TL);
		if (fa && fb) {
			const gr = c.createLinearGradient(fa[0], fa[1], fb[0], fb[1]);
			gr.addColorStop(0, 'rgba(20,12,36,0)'); gr.addColorStop(1, 'rgba(28,18,50,0.85)');
			poly(mT, [[-0.5 - split - 0.02, TL * 0.72], [0.5 + split + 0.02, TL * 0.72], [0.5 + split + 0.02, TL], [-0.5 - split - 0.02, TL]], gr);
		}

		// ---- judgment line + laser cursors (crit transform)
		line(mC, -0.52, 0, 0.52, 0, 'rgba(90,190,255,0.45)', 10);
		line(mC, -0.52, 0, 0.52, 0, '#ffffff', 3);
		for (const [lane, x] of cursors) {
			poly(mC, [[x, 0.01], [x - 0.055, -0.11], [x + 0.055, -0.11]], lane ? '#ff4aa0' : '#3ab4ff');
			c.strokeStyle = '#fff'; c.lineWidth = 1; c.stroke();
		}
		c.restore();

		// ---- HUD
		const hx = Math.max(vx, 0) + 6, hy = Math.max(vy, 0) + 6;
		c.font = '11px ' + UI_FONT; c.textBaseline = 'top'; c.fillStyle = 'rgba(220,220,235,0.85)';
		c.fillText('BPM ' + K.fmtNum(bpm) + '   LANE-SPEED ' + (hs * bpm / 100).toFixed(2) + '   HS ' + hs.toFixed(2), hx, hy);
		const hud = [];
		if (cam.pitchIn) hud.push('top ' + Math.round(cam.pitchIn * 100));
		if (cam.zoom) hud.push('btm ' + Math.round(cam.zoom * 100));
		if (cam.offset) hud.push('side ' + Math.round(cam.offset * 100));
		if (cam.rot) hud.push('rot ' + Math.round(cam.rot) + '°');
		if (cam.split) hud.push('split ' + Math.round(cam.split * 100));
		hud.push('tilt ' + (-cam.roll * 360).toFixed(1) + '°');
		c.fillStyle = 'rgba(170,170,190,0.75)';
		c.fillText(hud.join('  '), hx, hy + 14);
		if (S.drawOffsetMs) c.fillText('DRAW ' + (S.drawOffsetMs > 0 ? '+' : '') + S.drawOffsetMs + ' ms', hx, hy + 28);
	}

	// Engine tilt over the whole chart in KSH units (1 = 10 deg), sampled at 120 Hz of song time; cached per edit.
	tiltTrack() {
		this._prep();
		if (this._tt && this._tt.ver === this.ver) return this._tt;
		const RATE = 120, ed = this.ed;
		const endT = Math.max(960, (ed.chartEndTick ? ed.chartEndTick() : 0) + 960);
		const s0 = this.secAt(0) - 1, s1 = this.secAt(endT);
		const n = Math.max(2, Math.ceil((s1 - s0) * RATE) + 1), v = new Float32Array(n);
		const st = this._freshSim(s0 - 1.5);
		const h = 1 / RATE;
		while (st.sec + h <= s0) this._step(st, st.sec + h, h);
		for (let k = 0; k < n; k++) { const target = s0 + k * h; if (target > st.sec) this._step(st, target, target - st.sec); v[k] = -st.roll / PV.MAX_ROLL; }
		this._tt = { ver: this.ver, s0, rate: RATE, v };
		return this._tt;
	}
	tiltAtTick(t) {
		const tt = this.tiltTrack(), x = (this.secAt(t) - tt.s0) * tt.rate, k = Math.floor(x);
		if (k < 0) return tt.v[0]; if (k + 1 >= tt.v.length) return tt.v[tt.v.length - 1];
		return tt.v[k] + (tt.v[k + 1] - tt.v[k]) * (x - k);
	}

	// Engine tilt in KSH units (1 = 10°, + = clockwise like KSH tilt) sampled from t0 to t1 every `step`
	// ticks; used for the dashed "auto" ghost in the Tilt column.
	tiltCurve(t0, t1, step) {
		this._prep();
		const out = [];
		const s0 = this.secAt(Math.max(0, t0));
		const st = this._freshSim(s0 - 2.5);
		const h = 1 / 120;
		for (let t = t0; t <= t1; t += step) {
			const target = this.secAt(t);
			while (st.sec + h < target) this._step(st, st.sec + h, h);
			if (target > st.sec) this._step(st, target, target - st.sec);
			out.push([t, -st.roll / PV.MAX_ROLL]);
		}
		return out;
	}
}

</script>
<script>
/* ============================================================================
 * SOUND VOLTEX export and import: .vox chart (format 12 or 10), .2dx audio
 * (MS-ADPCM WAV in a 2DX container), music_db entry (Shift-JIS XML), jackets,
 * all in one .zip laid out like the game's data/music folder. Mappings follow the user's working pair
 * (mxm.ksh -> 2811_custom_5m.vox) and the community VOX format notes.
 * ========================================================================== */
const SDVX = (() => {
	const SLOTS = [
		{ id: 'novice', n: 1, l: 'n', label: '1 NOVICE' }, { id: 'advanced', n: 2, l: 'a', label: '2 ADVANCED' },
		{ id: 'exhaust', n: 3, l: 'e', label: '3 EXHAUST' }, { id: 'infinite', n: 4, l: 'i', label: '4 INF / GRV / HVN / VVD / XCD' },
		{ id: 'maximum', n: 5, l: 'm', label: '5 MAXIMUM' }, { id: 'ultimate', n: 6, l: 'u', label: '6 ULTIMATE' },
	];
	const KSH_DIFF_SLOT = { light: 'novice', challenge: 'advanced', extended: 'exhaust', infinite: 'maximum' };
	const pad = (n, w) => String(n).padStart(w, '0');
	const f2 = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2); return s === '-0.00' ? '0.00' : s; };

	// ---------------------------------------------------------------- VOX
	const SE_CODE = { clap: 3, clap_punchy: 3, clap_impact: 2, snare: 5, snare_lo: 4 };
	// FX hold effect -> #FXBUTTON EFFECT INFO line (the mapping lives in fx.js, so playback in "SOUND VOLTEX" mode matches)
	function fxLine(e, warn) {
		if (e.type === 'Phaser' && !e.sv) warn('Phaser has no SDVX equivalent; exported as Flanger.');
		const p = KSMFX.sdvxParams(e);
		return p ? KSMFX.svLine(p) : null;
	}

	function buildVox(chartIn, opts = {}) {
		const warnings = [];
		const warn = (msg, t) => { if (!warnings.some(w => w.msg === msg)) warnings.push({ t: t || 0, msg }); };
		const c = K.toUsc(chartIn, warnings, 'SOUND VOLTEX'); // no curves, rotation folded into tilt
		const tm = new K.Timing(c);
		const edge = opts.laserEdge || 124;
		const V12 = (opts.format || 12) >= 12; // 12 = current games (decimal laser positions, explicit spin lengths); 10 = older tools
		const pos = (t) => {
			t = Math.max(0, Math.round(t / 5) * 5);
			const ms = tm.measureOf(t), cpb = 192 / ms.d, cells = Math.round((t - ms.start) / 5);
			const beat = Math.floor(cells / cpb), cell = cells - beat * cpb;
			return pad(ms.m + 1, 3) + ',' + pad(beat + 1, 2) + ',' + pad(cell, 2);
		};
		const cells = (l) => Math.round(l / 5);
		const L = [];
		const sec = (name, rows) => { L.push('#' + name, ...rows, '#END', ''); };
		const sep = () => L.push('//====================================', '');
		L.push('//====================================', '// SOUND VOLTEX OUTPUT TEXT FILE', '//====================================', '');
		sec('FORMAT VERSION', [V12 ? '12' : '10']);
		sec('BEAT INFO', c.sig.map(s => pos(tm.measureStart(s.m)) + '\t' + s.n + '\t' + s.d));
		// BPM changes; stops become pauses ("4-") that end with the BPM restated
		const bpmRows = c.bpm.map(b => ({ t: b.t, s: pos(b.t) + '\t' + b.v.toFixed(4) + '\t4' }));
		for (const st of c.stops) {
			bpmRows.push({ t: st.t, s: pos(st.t) + '\t' + tm.bpmAt(st.t).toFixed(4) + '\t4-' });
			bpmRows.push({ t: st.t + st.l, s: pos(st.t + st.l) + '\t' + tm.bpmAt(st.t + st.l).toFixed(4) + '\t4' });
		}
		if (c.stops.length) warn('Stops are written as SDVX pauses; check them in game.');
		sec('BPM INFO', bpmRows.sort((a, b) => a.t - b.t).map(r => r.s));
		// auto-tilt modes
		const tiltRows = [];
		for (const p of c.tilt) {
			const v = typeof p.v === 'string' ? p.v : null; if (!v) continue;
			tiltRows.push(pos(p.t) + '\t' + (v.startsWith('keep') ? 2 : /bigger|biggest/.test(v) ? 1 : 0));
		}
		sec('TILT MODE INFO', tiltRows);
		sec('LYRIC INFO', []);
		let end = 0;
		for (const l of [...c.bt, ...c.fx]) for (const n of l) end = Math.max(end, n.t + n.l);
		for (const l of c.laser) for (const s of l) end = Math.max(end, K.sectionEndTick(s));
		const endM = tm.measureOf(end).m + 2;
		sec('END POSITION', [pos(tm.measureStart(endM))]);
		sec('TAB EFFECT INFO', KSMFX.TAB_STD.map(r => KSMFX.svLine(r, true)));
		// FX hold effects: one pair per hold, in time order (L before R)
		const defines = KSMFX.parseDefines(c.defs);
		const holds = [];
		c.fx.forEach((lane, li) => lane.forEach(n => { if (n.l > 0) holds.push({ n, li }); }));
		holds.sort((a, b) => a.n.t - b.n.t || a.li - b.li);
		const pairRows = [], holdIdx = new Map();
		for (const hd of holds) {
			const e = hd.n.fx ? KSMFX.parseEffect(hd.n.fx, defines) : null;
			const line = e ? fxLine(e, warn) : null;
			if (hd.n.fx && !line) warn('FX effect "' + hd.n.fx + '" has no SDVX equivalent and was left out.', hd.n.t);
			if (!line) { holdIdx.set(hd.n, 0); continue; }
			holdIdx.set(hd.n, 2 + pairRows.length / 3);
			pairRows.push(line, '0,\t0,\t0,\t0,\t0,\t0,\t0', '');
		}
		// lasers running an FX effect (a #define_filter with an FX type) -> "auto tab" spans over the lasers, one pair per effect
		const laserSpans = [];
		for (const lane of c.laser) for (const s of lane) laserSpans.push([s.t, K.sectionEndTick(s)]);
		laserSpans.sort((a, b) => a[0] - b[0]);
		const merged = [];
		for (const iv of laserSpans) { const last = merged[merged.length - 1]; if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]); else merged.push(iv.slice()); }
		const fsteps = [{ t: 0, v: KSMFX.filterKind(c.meta.filtertype, defines) }, ...c.filterType.map(p => ({ t: p.t, v: KSMFX.filterKind(p.v, defines) }))];
		const autoRows = [], autoPair = new Map();
		fsteps.forEach((f, i) => {
			const base = KSMFX.kindBase(f.v); if (!base.startsWith('fx:')) return;
			const t0 = f.t, t1 = i + 1 < fsteps.length ? fsteps[i + 1].t : Infinity;
			const [type, a, b] = base.slice(3).split(';');
			const p = KSMFX.sdvxParams({ type, p0: +a, p1: +b, sv: KSMFX.kindSv(f.v) });
			if (!p) { warn('Laser effect "' + type + '" has no SDVX equivalent and was left out.', t0); return; }
			const line = KSMFX.svLine(p);
			for (const [s0, s1] of merged) {
				const a0 = Math.max(s0, t0), a1 = Math.min(s1, t1); if (a1 <= a0) continue;
				if (!autoPair.has(line)) { autoPair.set(line, 2 + pairRows.length / 3); pairRows.push(line, '0,\t0,\t0,\t0,\t0,\t0,\t0', ''); }
				autoRows.push(`${pos(a0)}\t${cells(a1 - a0)}\t${autoPair.get(line)}`);
			}
		});
		L.push('#FXBUTTON EFFECT INFO', ...pairRows, '#END', '');
		const assign = []; for (let i = 0; i < 12; i++) assign.push(i + ',\t0,\t0.00,\t0.00', i + ',\t0,\t0.00,\t0.00');
		sec('TAB PARAM ASSIGN INFO', assign);
		sec('REVERB EFFECT PARAM', []);
		L.push('//====================================', '// TRACK INFO', '//====================================', '');
		// lasers
		const filterAt = (t) => { const p = K.lastAtOrBefore(c.filterType, t); return KSMFX.tabCode(KSMFX.filterKind(p ? p.v : c.meta.filtertype, defines)); };
		const spinAt = new Map(c.spins.map(s => [s.t, s]));
		const usedSpins = new Set();
		// SDVX has no spin direction: the game turns with the slam the roll sits on (the importer reads it back the same
		// way: spin dir = -slam dir). When several slams share the spin's tick, use one that goes the right way.
		const spinSlam = new Map();
		for (const pass of [true, false]) for (const lane of c.laser) for (const sec of lane) for (const p of sec.pts) {
			const sp = spinAt.get(sec.t + p.ry); if (!sp || spinSlam.has(sp) || p.v === p.vf) continue;
			if (!pass || Math.sign(p.vf - p.v) === -sp.dir) spinSlam.set(sp, p);
		}
		// SDVX spin durations include the overshoot, so they are twice the KSH length
		const rollCode = (s) => {
			const beats = 2 * s.l / 240;
			if (V12) return s.kind === 'spin' ? [6, Math.max(1, Math.round(beats * 10))] : [7, Math.max(1, Math.round(beats * 10))]; // length in 1/10 beats
			if (s.kind !== 'spin') return [5, 0]; // half spin / swing -> 3-beat swing
			return [[[2, 2], [3, 3], [1, 7]].reduce((best, [code, b]) => Math.abs(b - beats) < Math.abs(best[1] - beats) ? [code, b] : best, [2, 2])[0], 0];
		};
		const laserTrack = (lane) => {
			const rows = [];
			for (const s of c.laser[lane]) {
				const range = s.wide ? 2 : 1, last = s.pts.length - 1;
				const val = (v) => { v = K.clamp(v, 0, 50); return v <= 0 ? 0 : Math.ceil(v * (edge + 1) / 50 - 1e-9) - 1; }; // same as the reference conversion: 1->2, 2->4, 25->62, 47->117, 50->124
				const row = (t, v, node, roll, fc) => V12
					? `${pos(t)}\t${(K.clamp(v, 0, 50) / 50).toFixed(6)}\t${node}\t${roll[0]}\t${fc}\t${range}\t0\t0\t${roll[1]}`
					: `${pos(t)}\t${val(v)}\t${node}\t${roll[0]}\t${fc}\t${range}\t0`;
				s.pts.forEach((p, i) => {
					const t = s.t + p.ry, fc = filterAt(t);
					if (p.v !== p.vf) {
						const sp = spinAt.get(t); let roll = [0, 0];
						if (sp && spinSlam.get(sp) === p) { roll = rollCode(sp); usedSpins.add(sp); }
						rows.push(row(t, p.v, i === 0 ? 1 : 0, roll, fc));
						rows.push(row(t, p.vf, i === last ? 2 : 0, [0, 0], fc));
					} else rows.push(row(t, p.v, i === 0 ? 1 : i === last ? 2 : 0, [0, 0], fc));
				});
			}
			return rows;
		};
		const fxTrack = (lane) => c.fx[lane].map(n => n.l > 0 ? `${pos(n.t)}\t${cells(n.l)}\t${holdIdx.get(n) || 0}` : `${pos(n.t)}\t0\t${n.se ? (SE_CODE[n.se.split(';')[0]] || 0) : 0}`);
		const btTrack = (lane) => c.bt[lane].map(n => `${pos(n.t)}\t${cells(n.l)}\t0`);
		const tracks = [laserTrack(0), fxTrack(0), btTrack(0), btTrack(1), btTrack(2), btTrack(3), fxTrack(1), laserTrack(1)];
		tracks.forEach((rows, i) => { L.push('#TRACK' + (i + 1), ...rows, '#END', ''); sep(); });
		for (const sp of c.spins) if (!usedSpins.has(sp)) warn('A spin that is not on a slam was left out (SDVX spins start on slams).', sp.t);
		if (c.fx.some(l => l.some(n => n.l === 0 && n.se && !SE_CODE[n.se.split(';')[0]]))) warn('Custom FX chip sounds (sample files) have no SDVX equivalent and were left out.');
		L.push('#TRACK AUTO TAB', ...autoRows, '#END', '');
		sep();
		// SPCONTROLER: camera graphs
		const sp = ['001,01,00\tRealize\t3\t0\t36.12\t60.12\t110.12\t0.00', '001,01,00\tRealize\t4\t0\t0.62\t0.72\t1.03\t0.00',
			'001,01,00\tAIRL_ScaX\t1\t0\t0.00\t1.00\t0.00\t0.00', '001,01,00\tAIRR_ScaX\t1\t0\t0.00\t2.00\t0.00\t0.00'];
		const graph = (name, pts, conv) => {
			const num = pts.filter(p => typeof p.v === 'number');
			if (!num.length || num.every(p => p.v === 0 && (p.vf === undefined || p.vf === 0))) return;
			// like the game's own files: one row per segment, from the start of the chart to its end position
			const first = conv(num[0].v), endT = tm.measureStart(endM);
			if (num[0].t > 0) sp.push(`001,01,00\t${name}\t2\t${cells(num[0].t)}\t${f2(first)}\t${f2(first)}\t0.00\t0.00`);
			num.forEach((p, i) => {
				const q = num[i + 1], a = conv(p.v), b = conv(typeof p.vf === 'number' ? p.vf : p.v);
				if (a !== b) sp.push(`${pos(p.t)}\t${name}\t2\t0\t${f2(a)}\t${f2(b)}\t0.00\t0.00`);
				const until = q ? q.t : endT;
				if (until > p.t) sp.push(`${pos(p.t)}\t${name}\t2\t${cells(until - p.t)}\t${f2(b)}\t${f2(q ? conv(q.v) : b)}\t0.00\t0.00`);
			});
		};
		graph('CAM_RotX', c.cam.zoom_top, CAM.rotX);
		graph('CAM_Radi', c.cam.zoom_bottom, CAM.radi);
		graph('Morphing2', c.cam.center_split, CAM.split);
		// manual tilt (vox +1 = ksh -1.5); tilt=zero spans hold the lane flat
		const tiltSpans = [];
		for (let i = 0; i < c.tilt.length; i++) {
			const p = c.tilt[i], q = c.tilt[i + 1];
			const after = p.vf !== undefined ? p.vf : p.v;
			if (typeof p.v === 'number') {
				const a = CAM.tiltOut(p.v), b = typeof after === 'number' ? CAM.tiltOut(after) : CAM.tiltOut(p.v);
				if (a !== b) tiltSpans.push(`${pos(p.t)}\tTilt\t2\t0\t${f2(a)}\t${f2(b)}\t0.00\t0.00`);
				if (q && typeof after === 'number') tiltSpans.push(`${pos(p.t)}\tTilt\t2\t${cells(q.t - p.t)}\t${f2(b)}\t${f2(typeof q.v === 'number' ? CAM.tiltOut(q.v) : b)}\t0.00\t0.00`);
			} else if (after === 'zero') {
				const until = q ? q.t : tm.measureStart(endM);
				tiltSpans.push(`${pos(p.t)}\tTilt\t2\t${cells(until - p.t)}\t0.00\t0.00\t0.00\t0.00`);
			}
		}
		sp.push(...tiltSpans);
		if (c.cam.zoom_side.some(p => p.v !== 0 || (p.vf || 0) !== 0)) warn('SDVX has no sideways lane shift: Zoom Side (and slam kicks) are left out.');
		if (c.cam.scroll_speed.length) warn('scroll_speed is not exported to SDVX.');
		if (chartIn.cam.center_split.length) warn('center_split is exported as SDVX lane split (Morphing2); the amount is approximate.');
		if (chartIn.pfilterGain.length) warn('pfiltergain changes are not exported (SDVX laser effects have fixed strength).');
		L.push('#SPCONTROLER', ...sp, '#END', '');
		sep();
		return { text: L.join(V12 ? '\r\n' : '\n'), warnings };
	}

	// ---------------------------------------------------------------- VOX import
	// Camera / tilt scales shared by import and export. They come from hand-made USC conversions of official
	// charts (e.g. 777 MXM): CAM_RotX 0.5 ~ zoom_top 80 / -0.5 ~ -60, CAM_Radi 1.0 ~ zoom_bottom -130, Tilt 1.0 ~ tilt -1.5.
	const CAM = {
		rotX: (zt) => K.clamp(zt >= 0 ? zt / 140 : zt / 120, -1, 1), zoomTop: (v) => v >= 0 ? v * 140 : v * 120,
		radi: (zb) => K.clamp(zb <= 0 ? -zb / 125 : -zb / 75, -1, 1), zoomBottom: (v) => v >= 0 ? -v * 125 : -v * 75,
		tiltOut: (t) => -t / 1.5, tiltIn: (v) => -v * 1.5,
		split: (cs) => cs / 100 * 0.75, splitIn: (v) => v / 0.75 * 100,
	};
	// KSH effect string ('Retrigger;8', 'Echo;4;60', ...) -> parameters of an equivalent #define_fx / #define_filter
	function kshDefParams(ksh) {
		const [type, a, b] = ksh.split(';');
		let def = 'type=' + type;
		if (/Retrigger|Gate|Wobble|Echo/.test(type) && a) def += ';waveLength=1/' + a;
		if (type === 'Echo' && b) def += ';feedbackLevel=' + b + '%';
		if (type === 'BitCrusher' && a) def += ';reduction=' + a + 'samples;amount=' + a + 'samples'; // KSM reads reduction, USC reads amount
		if (type === 'PitchShift' && a) def += ';pitch=' + a;
		if (type === 'TapeStop' && a) def += ';speed=' + a + '%';
		return def;
	}
	// FX pair line -> KSH effect string (inverse of fxLine)
	function fxFromLine(f, warn) {
		const n = (i) => parseFloat(f[i]);
		switch (+f[0]) {
			case 1: { const N = Math.max(1, Math.round(4 * n(1) / (n(3) || 2))); return n(4) < 0.95 ? 'Echo;' + N + ';' + Math.round(n(4) * 100) : 'Retrigger;' + N; }
			case 8: { const N = Math.max(1, Math.round(4 * n(1) / (n(3) || 2))); return 'Echo;' + N + ';' + Math.round(K.clamp(n(4), 0, 1) * 100); }
			case 2: return 'Gate;' + Math.max(1, Math.round(2 * n(2) / (n(3) || 1)));
			case 3: return 'Flanger';
			case 4: return 'TapeStop;' + K.clamp(Math.round(22 / (n(3) || 0.44)), 1, 100);
			case 10: warn('"Tape Stop Ex" FX were imported as plain TapeStop.'); return 'TapeStop;50';
			case 5: return 'SideChain';
			case 6: return 'Wobble;' + Math.max(1, Math.round(n(6) * 3));
